# This repository's own test gate. Every workflow here is a workflow_call file that its callers run, so nothing ran
# the .github/scripts tests on a change: ci-gate #28 and #29 merged on PR Metadata alone (24 Oct 2026), and #28's
# route job then failed every non-full publishing CI run before it started (Forgejo pre-execution error 8). This
# runs every one of those tests on each pull request head and on main, as a required check.
name: Self-test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A newer head supersedes its pull request's older run; a main push is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-test:
    name: self-test
    runs-on: node
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      # Every file, named: Node 24 reads a bare directory argument as a module to run, not a folder to scan.
      - name: Run every .github/scripts test
        run: node --test .github/scripts/test-*.mjs
