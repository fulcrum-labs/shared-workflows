name: PR Metadata

on:
  # Intentional: evaluate the trusted base-branch workflow so a PR cannot edit
  # its own metadata gate. This job never executes pull-request code; branch
  # history is fetched as git data only and the workflow token is pinned to
  # read-only contents below.
  # synchronize is included so every pushed head gets a real workflow-job `pr-metadata` context
  # (the branch ruleset's required check). Code Quality does not republish a metadata check run.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  # The trusted base-branch push path republishes the same required pr-metadata
  # context on the exact commit that lands on main, which the branch ruleset
  # requires to exist there. It reads no pull-request payload field and, like
  # every path in this workflow, executes no pull-request code.
  push:
    branches: [main]
  # A merge queue requires every required context on the group commit it is
  # about to land, and this workflow publishes one of them; without this
  # trigger every queued merge would wait until the queue timed it out. The
  # pull request's title, body and branch were already judged by the
  # pull_request_target path; the group adds only the squash messages the
  # queue composes, and the main-commit scanner below reads those before they
  # land. Like the push path it reads no pull-request payload and executes no
  # pull-request code. A repository with no merge queue never fires it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# execution-substrate I10 (ES-10): a newer event on the same pull request
# (synchronize, edited, reopened) supersedes the older run, so only the newest
# event's run completes, and a superseded run never holds a gate slot. On
# 2026-09-25, foundry had 27 queued PR Metadata runs, up to 4 per branch.
# Push and merge-queue runs are never cancelled, because their result is what
# makes main (or the queued group) green. Each keys on its own event and
# commit, so they never share a group or queue behind each other. The event
# name is in the group because a merge queue fast-forwards main to the group
# head, so that push's github.sha equals merge_group.head_sha.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.event_name == 'pull_request' }}

