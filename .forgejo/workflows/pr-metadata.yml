            'with', 'from', 'that', 'this', 'than', 'then', 'them', 'they', 'when', 'what', 'will', 'your', 'have', 'into',
            'only', 'over', 'such', 'more', 'most', 'also', 'must', 'need', 'needs', 'should', 'would', 'could', 'there',
            'their', 'which', 'while', 'where', 'about', 'other', 'these', 'those', 'being', 'does', 'doe', 'done', 'just',
            'like', 'make', 'made', 'want', 'wants', 'work', 'works', 'used', 'using', 'add', 'adds', 'adding', 'build',
            'code', 'file', 'files', 'src', 'lib', 'index', 'main', 'test', 'tests', 'spec', 'example', 'import', 'export',
