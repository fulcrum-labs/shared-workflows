          // Paths come NUL-separated and exact (never parsed out of a diff header, where git C-quotes a non-ASCII name
          // and ends a spaced one with a tab); each is passed back as a literal pathspec.
          const files = git('diff', '-z', '--name-only', '--no-renames', range).split('\0').filter(Boolean)
            .filter(path => SHARED_WORKFLOWS_YAML.test(path))
            .map(path => ({ path, diff: git('--literal-pathspecs', 'diff', '--unified=0', '--no-color', '--no-ext-diff', '--no-renames', range, '--', path) }))
          const verdict = checkSharedWorkflowsPinFiles(files, SHARED_WORKFLOWS_PINS)
          if (!verdict.ok) {
            console.error('shared-workflows pin refused (add a reviewed commit on its protected main to config/shared-workflows-pins.json in platform-foundations first):')
            for (const error of verdict.errors) console.error(`  - ${error}`)
            process.exit(1)
          }
          console.log(`shared-workflows pins: ${verdict.checked} added, all on the allowlist`)
          NODE
      - name: Reject attribution in pushed main commits
        # Applies the same forbidden patterns to every commit message this push
        # delivered to main, so the required context exists on the exact main
        # commit. Everything here is trusted base-repository git data that has
        # already merged; the added-comment content of those commits was
        # scanned on the pull request that introduced it.
        #
        # This check is REQUIRED, so it must never report success over a set of
        # commits it cannot prove it scanned. The delivered set is established
        # before any scan, and every shape that cannot be established fails the
        # check loudly instead of narrowing the scan.
        #
        # A merge-queue run scans the same way, over the group it is about to
        # land: merge_group.base_sha (the main commit the group is built on)
        # to github.sha (the group head, the exact commit main will move to).
        # That range is precisely the squash messages the queue composed, so
        # the verdict lands before the commits do, not after.
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        env:
          PUSH_BEFORE: ${{ github.event.merge_group.base_sha || github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          node <<'NODE'
          // Captured as the very first statement, before any later line can
          // replace Set.prototype.has or install an own `has`. Classification
          // below calls THIS reference, so a later own-property or shared-
          // prototype replacement can neither widen nor narrow it. Tampering
          // that precedes this capture is not detectable in-process by any
          // self-comparison; it is covered by the focused test's exact pin of
          // this whole script, plus the known-answer self-test below.
          const setHas = Set.prototype.has
          const hasTerm = (collection, fragment) => setHas.call(collection, fragment)

          const { execFileSync } = require('node:child_process')

          const SHA = /^[0-9a-f]{40}$/
          const before = process.env.PUSH_BEFORE ?? ''
          const after = process.env.PUSH_AFTER ?? ''

          const git = (...args) => execFileSync('git', args, {
            encoding: 'utf8',
            maxBuffer: 256 * 1024 * 1024,
          })

          const commitExists = sha => {
            try {
              git('rev-parse', '--verify', '--quiet', `${sha}^{commit}`)
              return true
            } catch {
              return false
            }
          }

          if (!SHA.test(after)) {
            console.error('pushed head commit is required')
            process.exit(1)
          }
          if (!commitExists(after)) {
            console.error(`pushed head commit is unavailable: ${after}`)
            process.exit(1)
          }

          // Branch creation delivers everything reachable from the new tip, so
          // the whole reachable history is the delivered set.
          let logArgs = ['log', '--format=%B%x00', after]
          if (!/^0{40}$/.test(before)) {
            // Otherwise the delivered set is exactly before..after, which is
            // only meaningful once the boundary is proven. A malformed or
            // unavailable predecessor cannot bound the push, and a predecessor
            // that is not an ancestor of the new tip (a rollback or a rewritten
            // history) yields an empty or partial range that would publish a
            // false success over unscanned commits.
            if (!SHA.test(before)) {
              console.error(`pushed predecessor commit is malformed: ${before || '(empty)'}`)
              process.exit(1)
            }
            if (!commitExists(before)) {
              console.error(`pushed predecessor commit is unavailable: ${before}`)
              process.exit(1)
            }
            try {
              git('merge-base', '--is-ancestor', before, after)
            } catch {
              console.error(`pushed predecessor commit ${before} is not an ancestor of the pushed head commit ${after}`)
              process.exit(1)
            }
            logArgs = ['log', '--format=%B%x00', `${before}..${after}`]
          }

          // These four are byte-identical to both pull_request_target scanners.
          // Only the co-author trailer rule differs, and it is handled by the
          // classifier below rather than by a pattern over the whole line.
          const forbidden = [
            /🤖/,
            /claude-session/i,
            // Match named AI providers claiming authorship, never plain mentions.
            /\bGenerated (?:with|by)\b.*(?:Claude|Codex|Gemini|GPT|Anthropic|OpenAI|Google|OpenCode)/i,
            /^\s*(?:Generated by|Written by|Authored by)\s+(?:Claude|Codex|Gemini|GPT|OpenCode)/i,
          ]

          // The two pull_request_target scanners keep the blanket
          // `Co-Authored-By:` ban. That is right pre-merge, where a squash
          // harvests caller-supplied branch trailers and the PR gate refuses
          // every one of them before anything can land. The only text that is
          // NEW after that gate is the message GitHub composes at squash time,
          // and GitHub synthesizes a trailer naming the HUMAN author whenever
          // the squash author differs from the branch commit author -- routine
          // for bot-opened propagation and Renovate pull requests. The durable
          // rule bans AI authorship claims, not human coauthors, so this path
          // refuses a trailer only when the identity it names is an AI one.
          // Banning every trailer here would publish a permanently red required
          // context on main that `non_fast_forward` makes unclearable.
          const AI_IDENTITY_TERMS = new Set([
            'ai', 'llm', 'claude', 'opus', 'sonnet', 'haiku', 'codex',
            'gemini', 'opencode', 'gpt', 'openai', 'anthropic', 'google',
          ])
          // Generic identity words that pad a model name without making it a
          // person's name. `chat` is here so `chatgpt` composes as chat + gpt
          // rather than needing its own policy term.
          const IDENTITY_FILLER = new Set([
            'bot', 'assistant', 'agent', 'chat', 'cli', 'code', 'model', 'app',
            'api', 'context', 'preview', 'experimental', 'beta', 'pro', 'mini',
            'max', 'turbo', 'instant', 'plus', 'flash', 'ultra', 'nano', 'dev',
            'edition', 'version',
          ])
          // Version/edition fragments: 4, 4o, v4, v4o, 1m, 2026 -- and release
          // candidates, supported deliberately: rc, rc1.
          const VERSION_FRAGMENT = /^v?\d+[a-z]?$/
          const RELEASE_FRAGMENT = /^rc\d*$/
          // git interpret-trailers accepts whitespace before the colon, so the
          // push path recognizes it too. The two pull_request_target scanners keep
          // the base regex unchanged; their blanket ban is symmetric and untouched.
          const CO_AUTHOR_TRAILER = /^\s*Co-Authored-By\s*:/i
          // A git trailer value folds onto following lines that begin with
          // whitespace; that folded text is part of the SAME trailer value.
          const TRAILER_CONTINUATION = /^\s+\S/
          // The domain must be real dot-separated labels, so trailing junk
          // (`a@b.`, `a@b.example,`) is malformed rather than swallowed.
          // Permitted-CHARACTER grammar for a display name. It is not a
          // single-identity grammar: two parties joined by characters it must
          // permit still pass (accepted bound 8). Dashes use \p{Pd} so every
          // Unicode hyphen form is treated alike.
          const DISPLAY_GRAMMAR = /^[\p{L}\p{N}\p{M}\s\p{Pd}.'\u2019_\[\]()]*$/u
          const ADDRESS = /^[^\s<>@]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$/

          // Known-answer self-test of the captured primitive. Comparing
          // `collection.has` against `Set.prototype.has` would be unsound: a
          // replaced prototype makes both sides of that comparison the same
          // replaced function. This instead asks the captured primitive for
          // answers already known -- every declared term present, a sentinel
          // absent -- so a primitive tampered with BEFORE capture fails here and
          // the job exits without classifying. It does not, and cannot, detect a
          // widening keyed to some other value; that is the focused test's job.
          for (const term of AI_IDENTITY_TERMS) {
            if (hasTerm(AI_IDENTITY_TERMS, term) !== true) {
              console.error('membership primitive failed its known-answer self-test')
              process.exit(1)
            }
          }
          for (const term of IDENTITY_FILLER) {
            if (hasTerm(IDENTITY_FILLER, term) !== true) {
              console.error('membership primitive failed its known-answer self-test')
              process.exit(1)
            }
          }
          if (hasTerm(AI_IDENTITY_TERMS, 'sentinel-absent-term') !== false
            || hasTerm(IDENTITY_FILLER, 'sentinel-absent-term') !== false) {
            console.error('membership primitive failed its known-answer self-test')
            process.exit(1)
          }

          const fragmentKind = fragment => {
            if (hasTerm(AI_IDENTITY_TERMS, fragment)) return 'policy'
            if (hasTerm(IDENTITY_FILLER, fragment)) return 'filler'
            if (VERSION_FRAGMENT.test(fragment) || RELEASE_FRAGMENT.test(fragment)) return 'version'
            return null
          }

          // Complete segmentation of the whole identity stream. Returns null
          // when the stream cannot be fully composed from known fragments -- an
          // unknown fragment anywhere means this is a person's name, not a model
          // identity -- otherwise true when some full segmentation uses a policy
          // term. Any continuation is valid regardless of how a prefix was
          // reached, so keeping the policy-bearing path per index is sufficient.
          const composeStream = stream => {
            const reached = new Array(stream.length + 1).fill(null)
            reached[0] = false
            for (let start = 0; start < stream.length; start += 1) {
              if (reached[start] === null) continue
              for (let end = start + 1; end <= stream.length; end += 1) {
                const kind = fragmentKind(stream.slice(start, end))
                if (kind === null) continue
                const withPolicy = reached[start] || kind === 'policy'
                if (reached[end] === null || (withPolicy && !reached[end])) {
                  reached[end] = withPolicy
                }
              }
            }
            return reached[stream.length]
          }

          // Reduce a display name to ONE fragment stream: NFKD-decompose, keep
          // only alphanumeric runs, CONCATENATE them, lowercase.
          //
          // Decomposition must come FIRST. NFKC would compose a base letter and
          // a combining mark into a single precomposed letter, which the run
          // filter would then keep: `Cla<acute>ude` would survive as an accented
          // `claude` and read as a human name. NFKD splits the mark off instead,
          // and the run filter drops it, because a combining mark is neither a
          // letter nor a number. NFKD also folds compatibility forms, so
          // fullwidth spellings reduce the same way.
          //
          // There is deliberately NO later mark strip: after NFKD and the run
          // filter the stream holds only letters and numbers, and lowercasing
          // them cannot reintroduce a mark. Concatenating the runs is what
          // removes separators and word boundaries. None of this folds
          // cross-script or small-capital lookalikes -- see the spec's bounds.
          const identityStream = display => [...display
              .normalize('NFKD')
              .matchAll(/[\p{L}\p{N}]+/gu)]
            .map(match => match[0])
            .join('')
            .toLowerCase()

          // Classify the value of ONE PHYSICAL trailer line. A folded value never
          // reaches here -- the scan loop refuses it before classification -- so
          // this function never sees a continuation stitched onto the line.
          // The address is never classified: a person is a person at any domain.
          //
          // What fails closed is bounded and specific: the enumerated malformed
          // address shapes, any folded value, and any display character outside
          // DISPLAY_GRAMMAR. It is NOT all ambiguous attribution syntax --
          // permitted punctuation and ordinary word joins stay ambiguous and are
          // allowed under accepted bound 8. Returns 'ai', 'human' or 'malformed'.
          const coAuthorIdentity = value => {
            // Structural punctuation is normalized BEFORE the address is parsed.
            // Compatibility forms -- fullwidth `@`, fullwidth angle brackets --
            // otherwise carry no ASCII address punctuation, evade extraction,
            // stay in the display, and poison composition into the human
            // fallback. Normalizing first makes the address grammar see the
            // same characters the segmenter would.
            const trimmed = value
              .normalize('NFKC')
              .replace(/\p{Cf}|[\u200B-\u200D\uFEFF]/gu, '')
              .trim()
            if (trimmed.length === 0) return 'malformed'

            let display = trimmed
            if (/[<>]/.test(trimmed)) {
              // Exactly one bracketed address, at the very end, holding an
              // address. Nested, stray, empty, repeated and non-address
              // delimiters are all malformed.
              const framed = trimmed.match(/^([^<>]*)<([^<>]+)>$/)
              if (!framed || !ADDRESS.test(framed[2])) return 'malformed'
              display = framed[1]
            } else {
              // Bare form: at most one address token, and it must be last.
              const tokens = trimmed.split(/\s+/)
              const addressed = tokens.filter(token => token.includes('@'))
              if (addressed.length > 1) return 'malformed'
              if (addressed.length === 1) {
                const last = tokens[tokens.length - 1]
                if (addressed[0] !== last || !ADDRESS.test(last)) return 'malformed'
                display = tokens.slice(0, -1).join(' ')
              }
            }

            // Refuse every display character OUTSIDE a positive grammar: a
            // display name is letters, digits, marks, whitespace, dashes, and
            // the few punctuation marks that occur in personal and app
            // identities. An allowlist on purpose -- a list of forbidden
            // separators can always be stepped around by one more, so `,` `;`
            // `:` `@` `/` `&` `|` `+` `*` `=` `~` `#` and anything unlisted all
            // fail closed by construction.
            //
            // That is the exact claim. It is NOT a closure of multi-party
            // syntax, and must not be read as one. Two parties can be joined by
            // punctuation this grammar has to permit -- `Human.ChatGPT`,
            // `Human-ChatGPT`, `Human_ChatGPT`, `Human(ChatGPT)`,
            // `Human[ChatGPT]`, `Human'ChatGPT` -- or by ordinary words,
            // `Human and ChatGPT`. Each is structurally identical to a genuine
            // single identity that must stay clearable: `J.R.Hartley`,
            // `Claude-Dupont`, `jane_doe`, `Jane Doe (Acme)`, `renovate[bot]`,
            // `O'Brien Smith`, `Claude Dupont`. Refusing the AI-joined form
            // necessarily refuses the human one, which is the unclearable-red
            // direction this gate must avoid. See accepted bound 8 in the spec.
            if (!DISPLAY_GRAMMAR.test(display)) return 'malformed'

            const stream = identityStream(display)
            // A trailer with no display name names nobody: fail closed rather
            // than silently admitting an unattributable co-author.
            if (stream.length === 0) return 'malformed'
            const composed = composeStream(stream)
            if (composed === null) return 'human'
            return composed ? 'ai' : 'human'
          }

          for (const message of git(...logArgs).split('\u0000')) {
            const lines = message.split(/\r?\n/)
            for (const line of lines) {
              if (forbidden.some(pattern => pattern.test(line))) {
                console.error(`pushed commit message contains prohibited attribution: ${line.trim()}`)
                process.exit(1)
              }
            }
            for (let index = 0; index < lines.length; index += 1) {
              if (!CO_AUTHOR_TRAILER.test(lines[index])) continue
              const value = lines[index].replace(CO_AUTHOR_TRAILER, '')
              // A git trailer value may fold onto following whitespace-indented
              // lines. A co-author trailer never needs to, and a folded one is
              // either a second identity or unattributable, so it fails closed
              // instead of being stitched together and guessed at.
              if (index + 1 < lines.length && TRAILER_CONTINUATION.test(lines[index + 1])) {
                console.error(`pushed commit message contains a malformed co-author identity: ${value.trim()}`)
                process.exit(1)
              }
              const verdict = coAuthorIdentity(value)
              if (verdict === 'malformed') {
                console.error(`pushed commit message contains a malformed co-author identity: ${value.trim()}`)
                process.exit(1)
              }
              if (verdict === 'ai') {
                console.error(`pushed commit message contains prohibited attribution: ${value.trim()}`)
                process.exit(1)
              }
            }
          }
          NODE
