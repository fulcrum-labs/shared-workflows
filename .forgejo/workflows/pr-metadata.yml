            }
            for (const word of String(text ?? '').split(/[^A-Za-z0-9]+/)) {
              const parts = word.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase().split(' ')
              // A camelCase word counts both as its parts and whole: "TypeScript" in an
              // index line and "typescript" in a request are the same word.
              if (parts.length > 1) push(word.toLowerCase())
              for (const part of parts) push(part)
            }
            return out
          }
          
          function stripTicks(text) {
            return String(text ?? '').replace(/`/g, '').trim()
          }
          
          function clip(text, max) {
            const value = String(text ?? '').replace(/\s+/g, ' ').trim()
            return value.length <= max ? value : `${value.slice(0, max - 1).trimEnd()}…`
          }
          
          function candidateRef(source, name) {
            return `${source}:${name}`
          }
          
          // --- Index parsing ---------------------------------------------------------
          
          const LIST_FIELDS = new Map([
            ['use when', 'whenToUse'],
            ['do not use when', 'whenNot'],
            ['minimal setup', 'setup'],
            ['common mistakes', 'mistakes'],
            ['provides', 'provides'],
            ['related packages', 'related'],
            ['required bindings', 'setup'],
            ['required env', 'setup'],
          ])
          
          function blankEntry(name, title, owner, kind) {
            return {
              source: 'estate', ref: candidateRef('estate', name), name, title, owner, kind,
              purpose: '', path: '', example: '', stability: '', pointer: '',
              whenToUse: [], whenNot: [], setup: [], mistakes: [], provides: [], related: [],
            }
          }
          
          // `Name (`owner/repo`, stream `x`)` -> the repository is the durable name.
          function splitHeading(heading) {
            const text = stripTicks(heading)
            const paren = text.match(/^(.*?)\s*\((.+)\)\s*$/)
            if (!paren) return { name: text, title: text, owner: '' }
            const repo = paren[2].match(OWNER_REPO)
            if (!repo) return { name: text, title: text, owner: '' }
            const stream = paren[2].match(/stream\s+([a-z_]+)/i)
            return { name: repo[0], title: paren[1].trim(), owner: `${repo[0]}${stream ? ` (stream ${stream[1]})` : ''}` }
          }
          
          function sectionOwner(h2) {
            const text = stripTicks(h2)
            const paren = text.match(/\(([^)]+)\)\s*$/)
            return paren ? paren[1] : text
          }
          
          function parseProvenance(lines) {
            const sources = []
            let generatedAt = ''
            for (const line of lines) {
              const generated = line.match(/^Generated\s+(\S+)\s+from:/)
              if (generated) generatedAt = generated[1]
              const source = line.match(/^-\s+`([^`]+)`\s+—\s+\S+\s+@\s+`([0-9a-f]{7,40})`(?:\s+\(observed\s+([^)]+)\))?/)
              if (source) sources.push({ repo: source[1], sha: source[2], observedAt: source[3] ?? '' })
            }
            return { generatedAt, sources }
          }
          
          function evidenceLimits(entry, provenance) {
            const home = provenance.sources.find(source => new RegExp(`(^|[^\\w/-])${source.repo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}($|[^\\w-])`).test(entry.owner))
            const pinned = home ? `${home.repo}@${home.sha.slice(0, 7)}${home.observedAt ? ` observed ${home.observedAt}` : ''}` : (provenance.generatedAt ? `index generated ${provenance.generatedAt}` : 'index generation time unknown')
            return `read from the estate index (${pinned}); the summary and the working-example path are not re-verified against the source`
          }
          
          /**
           * The estate index (docs/agent/shared-capabilities.md) as candidate records.
           * `ok` is false when the text carries no recognisable entry, so the caller can
           * say the index was unreadable rather than report an empty search.
           */
          function parseEstateIndex(text) {
            const lines = String(text ?? '').split(/\r?\n/)
            const provenanceStart = lines.findIndex(line => /^##\s+Provenance\s*$/.test(line))
            const provenance = provenanceStart === -1 ? { generatedAt: '', sources: [] } : parseProvenance(lines.slice(provenanceStart + 1))
            const entries = []
            let h2 = ''
            let h3 = ''
            let entry = null
            let field = null
            let skipSection = false
            let inPackageTable = false
          
            const finish = () => {
              if (!entry) return
              entry.evidenceLimits = evidenceLimits(entry, provenance)
              if (!entry.path) entry.path = entry.name
              if (!entry.purpose && entry.provides.length > 0) entry.purpose = entry.provides.join('; ')
              entries.push(entry)
              entry = null
            }
          
            for (const line of lines) {
              const heading2 = line.match(/^##\s+(.+?)\s*$/)
              if (heading2) {
                finish()
                h2 = heading2[1]
                h3 = ''
                field = null
                inPackageTable = false
                skipSection = /^(Where new behaviour lives|Provenance)\b/.test(h2)
                continue
              }
              if (skipSection) continue
              const heading3 = line.match(/^###\s+(.+?)\s*$/)
              if (heading3) {
                finish()
                h3 = heading3[1]
                field = null
                inPackageTable = /^Go-plane packages\b/.test(stripTicks(h3))
                if (inPackageTable) continue
                const { name, title, owner } = splitHeading(h3)
                const established = /^Established approaches\b/.test(h2)
                entry = blankEntry(name, title, owner || sectionOwner(h2), established ? 'approach' : (/capabilit/i.test(h2) ? 'capability' : (/service/i.test(h2) ? 'service' : (/module|package/i.test(h2) ? 'package' : 'entry'))))
                continue
              }
              if (inPackageTable) {
                const row = line.match(/^\|\s*`([^`]+)`\s*\|\s*([^|]+?)\s*\|\s*(.+?)\s*\|\s*(.*?)\s*\|\s*$/)
                if (row) {
                  const packageEntry = blankEntry(`fulcrum-labs/foundry:${row[1]}`, row[1], 'fulcrum-labs/foundry', `go-plane ${stripTicks(row[2])}`)
                  packageEntry.purpose = row[3]
                  packageEntry.path = `${row[1]}/`
                  packageEntry.setup = row[4] && row[4] !== '—' ? [`consumers: ${stripTicks(row[4])}`] : []
                  packageEntry.evidenceLimits = evidenceLimits(packageEntry, provenance)
                  entries.push(packageEntry)
                }
                continue
              }
              if (!entry) continue
          
              const scalar = line.match(/^\*\*([^*:]+):\*\*\s*(.*)$/)
              if (scalar) {
                field = null
                const key = scalar[1].trim().toLowerCase()
                const value = scalar[2].trim()
                if (key === 'stability') entry.stability = stripTicks(value)
                else if (key === 'summary') entry.purpose = value
                else if (key === 'working example') entry.example = stripTicks(value)
                else if (key === 'pointer') entry.pointer = stripTicks(value)
                else if (key === 'stage') entry.kind = `capability (${stripTicks(value)})`
                else if (key === 'invocation') entry.setup.push(`invocation: ${value}`)
                else if (key === 'hosts') entry.setup.push(`hosts: ${stripTicks(value)}`)
                continue
              }
              const listHead = line.match(/^\*\*([^*]+)\*\*\s*$/)
              if (listHead) {
                field = LIST_FIELDS.get(listHead[1].trim().toLowerCase()) ?? null
                continue
              }
              const bullet = line.match(/^-\s+(.+?)\s*$/)
              if (bullet && field) {
                entry[field].push(stripTicks(bullet[1]))
                continue
              }
              if (line.trim() && !entry.purpose && !field && !line.startsWith('|')) {
                entry.purpose = line.trim()
              }
            }
            finish()
            return { entries, provenance, ok: entries.length > 0 }
          }
          
          const LOCAL_SECTION_KINDS = new Map([
            ['tables', 'table'], ['modules', 'module'], ['components', 'component'], ['workers', 'worker'],
            ['packages', 'package'], ['clients and adapters', 'client'], ['schemas', 'schema'], ['shared dependencies', 'shared dependency'],
          ])
          
          /** This repository's mechanism index (docs/agent/mechanisms.md) as candidate records. */
          function parseMechanismIndex(text) {
            const entries = []
            let kind = ''
            let sections = 0
            for (const line of String(text ?? '').split(/\r?\n/)) {
              const heading = line.match(/^##\s+(.+?)\s*\(\d+\)\s*$/)
              if (heading) {
                kind = LOCAL_SECTION_KINDS.get(heading[1].trim().toLowerCase()) ?? ''
                if (kind) sections += 1
                continue
              }
              if (!kind) continue
              const item = line.match(/^-\s+`([^`]+)`(?:\s+—\s+(.*?))?(?:\s+—\s+`([^`]+)`)?\s*$/)
              if (!item) continue
              const detail = item[2] ? stripTicks(item[2]) : ''
              const path = item[3] ?? item[1]
              const entry = blankEntry(item[1], item[1], 'this repository', kind)
              entry.source = 'local'
              entry.ref = candidateRef('local', item[1])
              entry.path = path
              entry.purpose = detail ? `${kind} ${item[1]}: ${detail}` : `Existing ${kind} in this repository: ${item[1]}`
              entry.evidenceLimits = 'read from this repository\'s generated mechanism index; it lists the mechanism by path and carries no purpose text'
              entries.push(entry)
            }
            // An index of "- none" sections is a valid empty index; one with no section
            // this parser recognises is a format it cannot read.
            return { entries, ok: sections > 0 }
          }
          
          // --- Ranking ---------------------------------------------------------------
          
          function entryFields(entry) {
            const bulletSets = list => list.map(text => ({ text, tokens: new Set(tokenize(text)) }))
            return {
              name: new Set(tokenize(`${entry.name} ${entry.title}`)),
              purpose: new Set(tokenize(`${entry.purpose} ${entry.provides.join(' ')} ${entry.kind}`)),
              path: new Set(tokenize(`${entry.path} ${entry.pointer}`)),
              use: bulletSets(entry.whenToUse),
              not: bulletSets(entry.whenNot),
            }
          }
          
          function buildStats(entries) {
            const documents = entries.map(entry => {
              const fields = entryFields(entry)
              const all = new Set([...fields.name, ...fields.purpose, ...fields.path])
              for (const bullet of [...fields.use, ...fields.not]) for (const token of bullet.tokens) all.add(token)
              return { entry, fields, all }
            })
            const df = new Map()
            for (const document of documents) for (const token of document.all) df.set(token, (df.get(token) ?? 0) + 1)
            const idf = token => Math.log(1 + documents.length / (1 + (df.get(token) ?? 0)))
            return { documents, df, idf }
          }
          
          function bestBullet(bullets, queryTokens, idf) {
            let best = { tokens: [], weight: 0, text: '' }
            for (const bullet of bullets) {
              const shared = queryTokens.filter(token => bullet.tokens.has(token))
              const weight = shared.reduce((sum, token) => sum + idf(token), 0)
              if (weight > best.weight) best = { tokens: shared, weight, text: bullet.text }
            }
            return best
          }
          
          function mentionsEntry(text, entry) {
            const lowered = text.toLowerCase()
            const name = entry.name.toLowerCase()
            const tail = name.split('/').slice(-2).join('/')
            const check = needle => needle.length >= 5 && new RegExp(`(^|[^a-z0-9@/-])${needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}($|[^a-z0-9-])`).test(lowered)
            return check(name) || (tail.includes('/') && check(tail))
          }
          
          /**
           * Rank the candidates a request is covered by. `query` is the request's words;
           * `entries` come from the two index parsers. Returns the small ranked set, the
           * candidates dismissed by their own "do not use when" lines (with that line as
           * evidence), and how many entries were searched.
           */
          function rankCandidates({ query, entries, limit = RETURNED_CANDIDATES }) {
            const queryTokens = [...new Set(tokenize(query))].slice(0, MAX_QUERY_TOKENS)
            const { documents, df, idf } = buildStats(entries)
            const inVocabulary = queryTokens.filter(token => df.has(token))
            const ceiling = inVocabulary.reduce((sum, token) => sum + idf(token) * 3, 0)
            const scored = []
            for (const { entry, fields } of documents) {
              let weight = 0
              const matched = []
              for (const token of inVocabulary) {
                const useHit = fields.use.some(bullet => bullet.tokens.has(token))
                const level = fields.name.has(token) ? 3 : (fields.purpose.has(token) || useHit ? 2 : (fields.path.has(token) ? 1 : 0))
                if (level > 0) { weight += idf(token) * level; matched.push(token) }
              }
              if (matched.length === 0 || ceiling === 0) continue
              const namedMatch = matched.some(token => fields.name.has(token))
              const score = weight / ceiling
              if (matched.length < 2 && !namedMatch) continue
              const useHit = bestBullet([...fields.use, { text: entry.purpose, tokens: fields.purpose }], inVocabulary, idf)
              const notHit = bestBullet(fields.not, inVocabulary, idf)
              const dismissed = notHit.tokens.length >= 2 && notHit.weight > useHit.weight
              // A weak overall match is not worth listing, but a candidate the request
              // matches on two words that its own "do not use when" rules out is still
              // named, so a superficially similar wrong candidate is answered.
              if (score < MIN_SCORE && !dismissed) continue
              // A "do not use when" line the request also matches, without outweighing
              // the "use when" side, still counts against the candidate.
              const share = notHit.weight / (notHit.weight + useHit.weight || 1)
              scored.push({ entry, fields, score: score * (1 - 0.5 * share), matched, notHit, dismissed, caution: !dismissed && notHit.tokens.length >= 2 ? notHit : null })
            }
          
            const dismissals = scored.filter(item => item.dismissed)
            const redirected = new Map()
            for (const dismissal of dismissals) {
              for (const bullet of dismissal.fields.not) {
                if (bullet.text !== dismissal.notHit.text) continue
                for (const target of entries) {
                  if (target.ref !== dismissal.entry.ref && mentionsEntry(bullet.text, target)) {
                    redirected.set(target.ref, dismissal.entry.ref)
                  }
                }
              }
            }
            const candidates = scored.filter(item => !item.dismissed).map(item => {
              const from = redirected.get(item.entry.ref)
              return { ...item, score: item.score + (from ? REDIRECT_BONUS : 0), redirectedFrom: from ?? '' }
            })
            // Redirect targets that matched the request too weakly to be scored still
            // surface: a dismissed candidate names where the work belongs.
            for (const [targetRef, fromRef] of redirected) {
              if (candidates.some(item => item.entry.ref === targetRef)) continue
              const target = documents.find(document => document.entry.ref === targetRef)
              if (target) candidates.push({ entry: target.entry, fields: target.fields, score: REDIRECT_BONUS, matched: [], notHit: { tokens: [], weight: 0, text: '' }, dismissed: false, caution: null, redirectedFrom: fromRef })
            }
            candidates.sort((a, b) => b.score - a.score || a.entry.ref.localeCompare(b.entry.ref))
          
            const publish = (item, extra = {}) => ({
              ref: item.entry.ref, source: item.entry.source, kind: item.entry.kind, name: item.entry.name, title: item.entry.title,
              owner: item.entry.owner, purpose: item.entry.purpose, path: item.entry.path, example: item.entry.example,
              whenToUse: item.entry.whenToUse.slice(0, 3), whenNot: item.entry.whenNot.slice(0, 3),
              constraints: [item.entry.stability ? `stability ${item.entry.stability}` : '', ...item.entry.setup.slice(0, 2), ...item.entry.mistakes.slice(0, 1)].filter(Boolean),
              stability: item.entry.stability, evidenceLimits: item.entry.evidenceLimits,
              score: Math.round(item.score * 100) / 100, matched: item.matched, ...extra,
            })
            return {
              queryTokens,
              searched: entries.length,
              candidates: candidates.slice(0, limit).map(item => publish(item, {
                why: `${item.redirectedFrom
                  ? `named by the "do not use when" of ${item.redirectedFrom}, which the request matched; `
                  : ''}request words covered: ${item.matched.join(', ') || 'none directly'}${item.caution ? `; caution, its "do not use when" also matches: "${clip(item.caution.text, 140)}"` : ''}`,
              })),
              dismissed: dismissals.sort((a, b) => b.score - a.score || a.entry.ref.localeCompare(b.entry.ref)).slice(0, RETURNED_DISMISSALS).map(item => publish(item, {
                why: `dismissed by its own "do not use when": "${clip(item.notHit.text, 160)}" (request words in that line: ${item.notHit.tokens.join(', ')})`,
                dismissal: { line: item.notHit.text, tokens: item.notHit.tokens },
              })),
            }
          }
          
          // --- Graph (FM-19 hybrid retrieval) -----------------------------------------
          
          /**
           * kb_query's `retrieval` block as candidate records. Only passages in force now
           * are candidates; the rest are counted so the scope statement can say so.
           */
          function retrievalCandidates(retrieval, limit = 3) {
            const passages = Array.isArray(retrieval?.passages) ? retrieval.passages : []
            const current = passages.filter(passage => passage?.authority === 'current' && passage?.current_authority !== 'superseded' && !passage?.disputed)
            const candidates = current.slice(0, limit).map((passage, index) => ({
              ref: candidateRef('kb', String(passage.parent_id ?? '')),
              source: 'kb', kind: String(passage.type ?? 'entry'), name: String(passage.parent_id ?? ''), title: String(passage.title ?? passage.parent_id ?? ''),
              owner: `KB ${passage.source_kind ?? 'entry'}`, purpose: clip(passage.text, 220), path: String(passage.source_ref ?? ''), example: '',
              whenToUse: [clip(passage.why_included, 200)].filter(Boolean), whenNot: [], constraints: [
                `authority ${passage.authority}`, `freshness ${passage.freshness?.label ?? 'unknown'}`,
                ...(Array.isArray(passage.relation_path) && passage.relation_path.length > 0 ? [`reached through ${passage.relation_path.join(' → ')}`] : []),
              ],
              stability: '', evidenceLimits: `KB revision ${passage.revision ?? '?'}, passage coverage ${passage.coverage ?? 'unknown'}; a knowledge entry, not a verified code path`,
              score: typeof passage.score === 'number' ? Math.round(passage.score * 100) / 100 : 0, matched: [], why: `graph rank ${index + 1}`,
            }))
            return {
              candidates,
              excluded: passages.length - current.length,
              refusal: retrieval?.refusal ? `${retrieval.refusal.code ?? 'refused'}: ${clip(retrieval.refusal.message, 160)}` : '',
              coverage: retrieval?.coverage && typeof retrieval.coverage === 'object' ? clip(JSON.stringify(retrieval.coverage), 160) : '',
              sources: Array.isArray(retrieval?.sources_searched) ? retrieval.sources_searched.map(String) : [],
            }
          }
          
          // --- Pull-request side: the Considered lines --------------------------------
          
          // Bullets, numbering, quotes and bold are how pull-request bodies get written:
          // `- Considered:`, `* Considered:`, `1. Considered:`, `> Considered:` and
          // `**Considered:**` all count.
          const CONSIDERED_LEAD = '^[ \\t]*(?:>[ \\t]*)*(?:(?:[-*+]|\\d{1,9}[.)])[ \\t]+)?(?:\\*\\*)?Considered(?::\\*\\*|\\*\\*:|:)'
          const CONSIDERED_LINE = new RegExp(CONSIDERED_LEAD, 'i')
          const CONSIDERED_PARTS = new RegExp(`${CONSIDERED_LEAD}[ \\t]*\`?([^\\s\`]+)\`?[ \\t]*(?:—|–|--?)[ \\t]*(extends|rejected|dismissed)\\b[ \\t]*:?[ \\t]*(.*?)[ \\t]*$`, 'i')
          const CONSIDERED_FORMS = [
            'Considered: <ref> — extends <the extension point: a path, symbol or entry point>',
            'Considered: <ref> — rejected: <why it does not serve, grounded in what the candidate says or a pointer>',
          ]
          
          const ESTATE_INDEX_FILE = 'docs/agent/shared-capabilities.md'
          const LOCAL_INDEX_FILE = 'docs/agent/mechanisms.md'
          
          // `null` text is an index file the base does not have; any other text is one it
          // has, readable or not. The distinction decides whether a requirement can be
          // waived, so it is kept.
          function buildCandidateIndex({ estateText, localText }) {
            const estate = estateText == null ? { entries: [], provenance: { generatedAt: '', sources: [] }, ok: false } : parseEstateIndex(estateText)
            const local = localText == null ? { entries: [], ok: false } : parseMechanismIndex(localText)
            const entries = [...estate.entries, ...local.entries]
            const unreadable = [
              ...(estateText != null && !estate.ok ? [ESTATE_INDEX_FILE] : []),
              ...(localText != null && !local.ok ? [LOCAL_INDEX_FILE] : []),
            ]
            const resolve = ref => {
              const wanted = String(ref).toLowerCase()
              const exact = entries.filter(entry => entry.ref.toLowerCase() === wanted)
              if (exact.length === 1) return exact[0]
              const [source, ...rest] = wanted.split(':')
              if (!['estate', 'local'].includes(source)) return null
              const name = rest.join(':')
              if (!name) return null
              const suffix = entries.filter(entry => entry.source === source && (entry.name.toLowerCase().endsWith(`/${name}`) || entry.title.toLowerCase() === name))
              return suffix.length === 1 ? suffix[0] : null
            }
            return { entries, resolve, estate, local, unreadable }
          }
          
          function candidateEvidenceText(entry) {
            return [entry.purpose, ...entry.whenToUse, ...entry.whenNot, ...entry.setup, ...entry.mistakes, ...entry.provides, entry.stability, entry.path, entry.pointer].join(' ')
          }
          
          // A pointer is something a reader can follow: a PR or issue number, a URL, a
          // kb: entry, or a path with a directory and a file (a dot or a second slash).
          // "n/a", "and/or" and "w/o" are not pointers.
          function hasPointer(text) {
            if (/https?:\/\/\S+|#\d+|\bkb:[\w.:-]{3,}/i.test(text)) return true
            // Sentence punctuation and quotes are not part of a path: "and/or." is not a file.
            return text.split(/\s+/)
              .map(token => token.replace(/^[(`"'*]+/, '').replace(/[.,;:)`"'!?*]+$/, ''))
              .some(token => (token.match(/[\w.@-]{2,}\/[\w./@-]{2,}/g) ?? []).some(path => path.includes('.') || path.split('/').length > 2))
          }
          
          function judgeConsidered({ ref, disposition, detail }, index) {
            const problems = []
            const words = detail.split(/\s+/).filter(Boolean)
            const kind = /^(rejected|dismissed)$/i.test(disposition) ? 'rejected' : 'extends'
            const placeholder = /^<[^>]*>$/.test(detail.trim()) || /<[a-z ]+>/i.test(detail)
            let status = 'external'
            let entry = null
            if (/^kb:/i.test(ref)) {
              if (ref.length <= 3) problems.push('names no KB entry after "kb:"')
            } else if (/^(estate|local):/i.test(ref)) {
              entry = index.resolve(ref)
              if (entry) status = 'resolved'
              else {
                status = 'unresolved'
                problems.push(`does not resolve in the base branch's ${/^estate:/i.test(ref) ? 'estate index (docs/agent/shared-capabilities.md)' : 'mechanism index (docs/agent/mechanisms.md)'}; use the ref the discovery hook printed`)
              }
            } else {
              status = 'unresolved'
              problems.push('is not a candidate ref (estate:<name>, local:<path> or kb:<entry id>)')
            }
            if (placeholder || words.length === 0) problems.push(`carries no ${kind === 'extends' ? 'extension point' : 'reason'}`)
            else if (kind === 'extends') {
              if (detail.trim().length < 3) problems.push('names no extension point')
            } else if (words.length < MIN_REJECTION_WORDS) {
              problems.push(`rejection reason is under ${MIN_REJECTION_WORDS} words`)
            } else if (entry) {
              // Engaged: two distinct words of the candidate's own text, or one from what
              // it rules out or constrains. One incidental shared word is not engagement.
              const ownName = new Set(tokenize(`${entry.name} ${entry.title}`))
              const reason = new Set(tokenize(detail).filter(token => !ownName.has(token)))
              const overall = new Set(tokenize(candidateEvidenceText(entry)))
              const strict = new Set(tokenize([...entry.whenNot, ...entry.setup, ...entry.mistakes].join(' ')))
              const shared = [...reason].filter(token => overall.has(token))
              const engages = shared.length >= 2 || [...reason].some(token => strict.has(token))
              if (!engages && !hasPointer(detail)) {
                problems.push('rejection is not supported: it neither engages with what the candidate says (two of its own words, or one from its "do not use when" or constraints) nor points at evidence (a PR, URL, kb: entry or file path)')
              }
            } else if (!hasPointer(detail)) {
              problems.push('rejection of a kb: entry is not supported: CI cannot read the entry, so the reason must point at evidence (a PR, URL, kb: entry or file path)')
            }
            return { ref, disposition: kind, status, problems }
          }
          
          // HTML comments a reviewer cannot see. A terminated comment is dropped wherever
          // it starts; an unterminated `<!--` hides the rest of the body only when it
          // starts a line (a block-level comment). Inside prose ("the <!-- token") or a
          // code span it is text, and swallowing the body after it would hide a visible,
          // correct line. One pass, linear in the body.
          function stripHtmlComments(text) {
