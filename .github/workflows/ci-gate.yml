name: CI Gate (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24.18.0'
      check-command:
        type: string
        default: 'pnpm run ci:local'
      docs-lint-enabled:
        type: boolean
        default: false
        description: 'Optional. Run the docs-convention lint job (@fulcrum-labs/docs-lint). Repos opt in via platform-foundations maintenance.docs_lint.'
      turbo-cache-enabled:
        type: boolean
        default: false
        description: 'Optional. Enable the signed Turbo remote cache for trusted callers. Fork pull requests remain uncached.'
      turbo-cache-api:
        type: string
        default: ''
        description: 'Optional. Turbo-compatible remote cache API URL.'
      turbo-cache-team:
        type: string
        default: ''
        description: 'Optional. Namespace used to isolate this repository family in the shared cache.'
      vitest-max-workers:
        type: string
        default: '2'
        description: 'Vitest worker cap for the check-command (VITEST_MAX_WORKERS, and VITEST_MAX_THREADS/VITEST_MAX_FORKS for Vitest < 4). The node job class envelope is 2 vCPU (olympus execution-substrate spec §3.1); Vitest otherwise starts os.availableParallelism() workers on a shared runner host and its 5 s test timeout fires under the contention.'
      cf-worker-name:
        type: string
        default: ''
        description: 'Optional. CF Worker script name. If set together with cf-account-id and the CF_BUILDS_TOKEN secret, the gate manually triggers a CF Build after passing on main/staging — bypasses CF Builds webhook dispatch latency.'
      cf-account-id:
        type: string
        default: ''
        description: 'Optional. CF account ID owning the worker (e.g. b8fd8daf73edd8fe6b6bd18eeaacf2bb for fulcrum).'
    secrets:
      CF_BUILDS_TOKEN:
        required: false
        description: 'Optional user-scoped (cfut_*) Cloudflare API token with Workers Builds Configuration: Edit + Workers Scripts: Read permissions.'
      TURBO_CACHE_TOKEN:
        required: false
        description: 'Optional bearer credential for the signed Turbo remote cache.'
      TURBO_CACHE_SIGNATURE_KEY:
        required: false
        description: 'Optional HMAC key used to sign and verify Turbo cache artifacts.'

permissions:
  contents: read

# PR heads share a ref-keyed group so a newer candidate cancels stale work.
# Main uses the immutable commit SHA: reruns reuse their original SHA/ref, and
# must not be evicted from the group's single pending slot by a newer main push.
concurrency:
  group: ci-gate-${{ github.repository }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    # 45, not 25: under a saturated self-hosted pool (2026-09-30 Forgejo flip day) infra's quality ran past 25
    # minutes three times with no failing test and was cancelled each time; a timeout is a guard, not a budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tracked node_modules
        # A node_modules entry in the commit (a directory, a file, or a symlink to someone's installed tree) ships a
        # whole dependency tree, or a pointer into another checkout's, to everyone who clones. `node_modules/` in a
        # .gitignore hides a real directory but not a symlink, so this reads the index itself.
        run: |
          tracked="$(git ls-files -z | grep -zE '(^|/)node_modules(/|$)' | tr '\0' '\n' | head -n 20 || true)"
          if [ -n "$tracked" ]; then
            echo "::error::node_modules is tracked in this commit; remove it from the index (git rm --cached) and ignore it as 'node_modules', without a trailing slash" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = "10.28.0"
          package_json = Path("package.json")
          if package_json.exists():
            data = json.loads(package_json.read_text())
            package_manager = data.get("packageManager")
            if isinstance(package_manager, str) and package_manager.startswith("pnpm@"):
              version = package_manager.split("@", 1)[1]
            else:
              volta = data.get("volta")
              if isinstance(volta, dict):
                volta_pnpm = volta.get("pnpm")
                if isinstance(volta_pnpm, str) and volta_pnpm:
                  version = volta_pnpm

          print(f"version={version}")
          PY

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Guard pnpm runner isolation
        run: |
          case "${PNPM_HOME:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::PNPM_HOME must be under RUNNER_TEMP on self-hosted runners; got '${PNPM_HOME:-<unset>}'"
              exit 1
              ;;
          esac

          if [ -e "$HOME/setup-pnpm" ]; then
            echo "::warning::Removing stale home-level pnpm setup from prior self-hosted jobs"
            # Best-effort only. Concurrent jobs on the same self-hosted host share
            # $HOME, so two runs can race this delete and rm exits non-zero with
            # "Directory not empty" — which, under `bash -e`, failed the whole build.
            # Correctness does not depend on this: PNPM_HOME is asserted to live under
            # RUNNER_TEMP by the hard check above, so leftover $HOME state is unused.
            rm -rf "$HOME/setup-pnpm" 2>/dev/null || \
              echo "::warning::Could not fully remove $HOME/setup-pnpm (concurrent job on this host); continuing because PNPM_HOME is pinned under RUNNER_TEMP"
          fi

          # Persistent runners can retain a user-level pnpm store-dir from a
          # prior runner instance. Keep cache discovery and install on this
          # job's current RUNNER_TEMP without mutating persistent config.
          # pnpm 10 reads the lowercase npm_config_* form only, and pnpm 11 reads
          # pnpm_config_* only; the uppercase NPM_CONFIG_STORE_DIR this step used
          # to export was read by neither, so every job on a host silently shared
          # the runner unit's npm_config_store_dir (/var/cache/ci/pnpm) and their
          # installs raced one store (ERR_PNPM_ENOENT copyfile / READ_FROM_STORE,
          # 2026-09-25/26). Export both spellings pnpm actually reads.
          echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          # v5 caches the pnpm store by default whenever package.json names a packageManager.
          # Off: nothing is stored on GitHub (operator ruling 2026-09-27), and on Forgejo the
          # runner's cache server lowercases keys, so every job re-uploaded the whole store.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Resolve Turbo cache eligibility
        id: turbo-cache
        env:
          TURBO_CACHE_ENABLED: ${{ inputs.turbo-cache-enabled }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Credentials are only ever injected for an explicit event allowlist:
          # push, merge_group, and same-repository pull_request. Every other
          # event (fork PRs, pull_request_target, issue_comment, workflow_run,
          # ...) gets an empty credential set and Turbo stays on its local
          # cache.
          eligible=false
          if [ "$TURBO_CACHE_ENABLED" = "true" ]; then
            case "$GITHUB_EVENT_NAME" in
              push|merge_group)
                eligible=true
                ;;
              pull_request)
                if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
                  eligible=true
                fi
                ;;
            esac
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Enforce signed-cache consumer contract
        if: ${{ steps.turbo-cache.outputs.eligible == 'true' }}
        run: |
          # Fail closed: never inject cache credentials into a consumer that
          # does not verify artifact signatures (remoteCache.signature).
          node - <<'JS'
          const fs = require('node:fs');
          let config;
          try {
            config = JSON.parse(fs.readFileSync('turbo.json', 'utf8'));
          } catch (error) {
            console.error('::error::turbo-cache-enabled requires a readable turbo.json: ' + error.message);
            process.exit(1);
          }
          if (config?.remoteCache?.signature !== true) {
            console.error('::error::turbo-cache-enabled requires remoteCache.signature=true in turbo.json');
            process.exit(1);
          }
          JS

      - name: Cap Vitest workers to the job class envelope
        id: vitest-cap
        env:
          VITEST_CAP: ${{ inputs.vitest-max-workers }}
        run: |
          case "$VITEST_CAP" in
            ''|*[!0-9]*|0) echo "::error::vitest-max-workers must be a positive integer, got '$VITEST_CAP'"; exit 1 ;;
          esac
          echo "workers=$VITEST_CAP" >> "$GITHUB_OUTPUT"
          echo "vitest workers capped at $VITEST_CAP (VITEST_MAX_WORKERS, VITEST_MAX_THREADS, VITEST_MAX_FORKS)"

      - name: Refuse a Turbo strict env that would strip the Vitest cap
        # Turbo 2 runs tasks in strict env mode (the default, and declared by
        # growth-labs/packages and publishing): a variable not in
        # globalPassThroughEnv never reaches the task, so VITEST_MAX_* would
        # be set here and every vitest would still start
        # os.availableParallelism() workers while the line above said
        # "capped". A repo that runs vitest under strict Turbo must pass the
        # three through; this says so by name instead of letting it look capped.
        run: |
          node - <<'VITEST_PASSTHROUGH'
          const fs = require('node:fs')
          const path = require('node:path')
          if (!fs.existsSync('turbo.json')) process.exit(0)
          const text = fs.readFileSync('turbo.json', 'utf8')
            .replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '').replace(/,(\s*[}\]])/g, '$1')
          const turbo = JSON.parse(text)
          if ((turbo.envMode ?? 'strict') !== 'strict') process.exit(0)
          const SKIP = new Set(['node_modules', '.git', 'dist', '.worktrees', '.turbo'])
          let usesVitest = false
          const walk = (dir, depth) => {
            if (usesVitest || depth > 4) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (SKIP.has(entry.name)) continue
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full, depth + 1)
              else if (entry.name === 'package.json' && /"vitest"/.test(fs.readFileSync(full, 'utf8'))) usesVitest = true
            }
          }
          walk('.', 0)
          if (!usesVitest) process.exit(0)
          const pass = turbo.globalPassThroughEnv ?? []
          const missing = ['VITEST_MAX_WORKERS', 'VITEST_MAX_THREADS', 'VITEST_MAX_FORKS'].filter(v => !pass.includes(v))
          if (missing.length > 0) {
            console.log(`::error::turbo.json runs in strict env mode and does not pass ${missing.join(', ')} through (globalPassThroughEnv), so the Vitest worker cap never reaches a test task. Add them to globalPassThroughEnv.`)
            process.exit(1)
          }
          VITEST_PASSTHROUGH

      - name: CI gate (typecheck + lint + test + build)
        # The cap line above is what was asked for; the observer here is what
        # happened: it samples the fork-pool workers every second and prints
        # the most that ran at once (per vitest process, and in total), so the
        # acceptance reads a real count, not the request.
        run: |
          # Only this step's own process tree is counted: on a guest shared
          # by 23 runners, a neighbour's uncapped job must not show up in
          # this job's "observed" line. A worker is a node process with
          # vitest's fork-worker script anywhere in its argv, so execArgv or
          # --conditions placed before the script do not hide it.
          observe() {
            root=$$
            max_total=0 max_per=0
            while :; do
              read -r per total <<EOF_COUNT
          $(ps -eo pid=,ppid=,args= 2>/dev/null | awk -v root="$root" '
            { ppid[$1] = $2; is[$1] = 0
              if ($3 ~ /(^|\/)node$/) for (i = 4; i <= NF; i++) if ($i ~ /vitest\/dist\/workers\/forks\.m?js$/) { is[$1] = 1; break } }
            END {
              desc[root] = 1; changed = 1
              while (changed) { changed = 0; for (p in ppid) if (!(p in desc) && (ppid[p] in desc)) { desc[p] = 1; changed = 1 } }
              for (p in is) if (is[p] && (p in desc)) count[ppid[p]]++
              total = 0; per = 0
              for (q in count) { total += count[q]; if (count[q] > per) per = count[q] }
              print per, total
            }')
          EOF_COUNT
              [ "${total:-0}" -gt "$max_total" ] && max_total=$total
              [ "${per:-0}" -gt "$max_per" ] && max_per=$per
              echo "$max_per $max_total" > "$RUNNER_TEMP/vitest-workers-observed"
              sleep 1
            done
          }
          observe &
          observer=$!
          set +e
          # The caller's command arrives through the environment, never spliced into this script as an
          # expression (run-shell-injection); eval runs it in this same shell, exactly as the inline text did.
          eval "$CHECK_COMMAND"
          status=$?
          set -e
          kill "$observer" 2>/dev/null || true
          read -r per total < "$RUNNER_TEMP/vitest-workers-observed" 2>/dev/null || { per=0; total=0; }
          echo "vitest workers observed (this step only): at most $per fork workers under one vitest process, $total at once in total (cap $VITEST_MAX_WORKERS)"
          exit "$status"
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
          VITEST_MAX_WORKERS: ${{ steps.vitest-cap.outputs.workers }}
          VITEST_MAX_THREADS: ${{ steps.vitest-cap.outputs.workers }}
          VITEST_MAX_FORKS: ${{ steps.vitest-cap.outputs.workers }}
          # Cache credentials are injected only when the eligibility step above
          # matched the trusted-event allowlist. Empty credentials leave Turbo
          # on its local cache and keep the gate fail-open when a caller has
          # not provisioned the cache yet.
          TURBO_API: ${{ steps.turbo-cache.outputs.eligible == 'true' && inputs.turbo-cache-api || '' }}
          TURBO_TOKEN: ${{ steps.turbo-cache.outputs.eligible == 'true' && secrets.TURBO_CACHE_TOKEN || '' }}
          TURBO_TEAM: ${{ steps.turbo-cache.outputs.eligible == 'true' && inputs.turbo-cache-team || '' }}
          TURBO_TEAMID: ${{ steps.turbo-cache.outputs.eligible == 'true' && inputs.turbo-cache-team || '' }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ steps.turbo-cache.outputs.eligible == 'true' && secrets.TURBO_CACHE_SIGNATURE_KEY || '' }}
          TURBO_REMOTE_CACHE_TIMEOUT: '10'
          TURBO_REMOTE_CACHE_UPLOAD_TIMEOUT: '10'

      - name: Lockfile integrity
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml missing"
            exit 1
          fi
          if [ -f package-lock.json ]; then
            echo "::error::package-lock.json found — use pnpm only"
            exit 1
          fi
          if [ -f yarn.lock ]; then
            echo "::error::yarn.lock found — use pnpm only"
            exit 1
          fi

      # pnpm audit removed 2026-05-13. Grype (below) covers the same
      # vulnerability surface using the OSV/NVD feeds and supports per-repo
      # allowlisting via .grype.yaml. pnpm audit lacks any allowlist mechanism
      # and was blocking PRs on transitive CVEs (e.g. basic-ftp via
      # @cloudflare/puppeteer) that the team had no near-term fix for.

      # Workers SQLite (D1 and DO SQLite) caps LIKE/GLOB patterns at 50 bytes;
      # a longer literal inside a CHECK constraint or trigger aborts every
      # write to that table with "LIKE or GLOB pattern too complex", while the
      # better-sqlite3 test harness keeps SQLite's 50000-byte default and stays
      # green. Fronts migration 0072 took a Masthead action down this way on
      # 2026-09-07 (KB d1-like-glob-pattern-50-byte-limit). A migration that
      # was later rebuilt may opt out with the comment
      # `-- d1-like-pattern-limit: superseded` on its own line.
      - name: D1 LIKE/GLOB pattern length
        run: |
          node - <<'D1_PATTERN_SCAN'
          const fs = require('node:fs')
          const path = require('node:path')
          const LIMIT = 50
          const SKIP = new Set(['node_modules', '.git', 'dist', '.worktrees', '.wrangler', '.astro', 'build', 'coverage'])
          const PATTERN = /\b(?:LIKE|GLOB)\s*'((?:[^']|'')*)'/gi
          const offenders = []
          let scanned = 0
          const walk = (dir, underMigrations) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (SKIP.has(entry.name)) continue
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                walk(full, underMigrations || entry.name === 'migrations')
              } else if (underMigrations && entry.name.endsWith('.sql')) {
                scanned += 1
                const sql = fs.readFileSync(full, 'utf8')
                if (/^\s*--\s*d1-like-pattern-limit:\s*superseded\s*$/m.test(sql)) continue
                for (const match of sql.matchAll(PATTERN)) {
                  const bytes = Buffer.byteLength(match[1], 'utf8')
                  if (bytes > LIMIT) {
                    const line = sql.slice(0, match.index).split('\n').length
                    offenders.push(`${path.relative(process.cwd(), full)}:${line} pattern is ${bytes} bytes (limit ${LIMIT})`)
                  }
                }
              }
            }
          }
          walk(process.cwd(), false)
          for (const offender of offenders) console.log(`::error::D1 LIKE/GLOB pattern too long — ${offender}`)
          if (offenders.length > 0) process.exit(1)
          console.log(`D1 LIKE/GLOB pattern length: ${scanned} migration file(s) scanned, none over ${LIMIT} bytes`)
          D1_PATTERN_SCAN

      - name: Accessibility (axe-core)
        run: |
          if grep -q '"test:a11y"' package.json 2>/dev/null; then
            pnpm run test:a11y
          else
            echo "::notice::No test:a11y script — skipping"
          fi

      - name: Performance (Lighthouse)
        continue-on-error: true
        run: |
          if grep -q '"test:perf"' package.json 2>/dev/null; then
            pnpm run test:perf
          else
            echo "::notice::No test:perf script — skipping"
          fi

      - name: Dead code (Knip)
        continue-on-error: true
        run: |
          if grep -q '"knip"' package.json 2>/dev/null; then
            pnpm exec knip
          else
            echo "::notice::Knip not configured — skipping"
          fi

  docs-lint:
    if: ${{ inputs.docs-lint-enabled }}
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = "10.28.0"
          package_json = Path("package.json")
          if package_json.exists():
            data = json.loads(package_json.read_text())
            package_manager = data.get("packageManager")
            if isinstance(package_manager, str) and package_manager.startswith("pnpm@"):
              version = package_manager.split("@", 1)[1]
            else:
              volta = data.get("volta")
              if isinstance(volta, dict):
                volta_pnpm = volta.get("pnpm")
                if isinstance(volta_pnpm, str) and volta_pnpm:
                  version = volta_pnpm

          print(f"version={version}")
          PY

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Guard pnpm runner isolation
        run: |
          case "${PNPM_HOME:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::PNPM_HOME must be under RUNNER_TEMP on self-hosted runners; got '${PNPM_HOME:-<unset>}'"
              exit 1
              ;;
          esac

          if [ -e "$HOME/setup-pnpm" ]; then
            echo "::warning::Removing stale home-level pnpm setup from prior self-hosted jobs"
            # Best-effort only. Concurrent jobs on the same self-hosted host share
            # $HOME, so two runs can race this delete and rm exits non-zero with
            # "Directory not empty" — which, under `bash -e`, failed the whole build.
            # Correctness does not depend on this: PNPM_HOME is asserted to live under
            # RUNNER_TEMP by the hard check above, so leftover $HOME state is unused.
            rm -rf "$HOME/setup-pnpm" 2>/dev/null || \
              echo "::warning::Could not fully remove $HOME/setup-pnpm (concurrent job on this host); continuing because PNPM_HOME is pinned under RUNNER_TEMP"
          fi

          # pnpm 10 reads the lowercase npm_config_* form only, and pnpm 11 reads
          # pnpm_config_* only; the uppercase NPM_CONFIG_STORE_DIR this step used
          # to export was read by neither, so every job on a host silently shared
          # the runner unit's npm_config_store_dir (/var/cache/ci/pnpm) and their
          # installs raced one store (ERR_PNPM_ENOENT copyfile / READ_FROM_STORE,
          # 2026-09-25/26). Export both spellings pnpm actually reads.
          echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          # v5 caches the pnpm store by default whenever package.json names a packageManager.
          # Off: nothing is stored on GitHub (operator ruling 2026-09-27), and on Forgejo the
          # runner's cache server lowercases keys, so every job re-uploaded the whole store.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Docs convention lint
        run: |
          if grep -q '"docs-lint"' package.json 2>/dev/null; then
            pnpm run docs-lint -- --json
          else
            pnpm dlx @fulcrum-labs/docs-lint@latest --json
          fi

  gitleaks:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # Its own directory under RUNNER_TEMP, and no move: on a runner whose RUNNER_TEMP is /tmp (Forgejo's),
        # extracting to /tmp and then moving onto "$RUNNER_TEMP/gitleaks" moved the file onto itself and failed.
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          # sha256 of gitleaks_8.21.2_linux_x64.tar.gz as listed in the v8.21.2 release's own gitleaks_8.21.2_checksums.txt
          # (and equal to the tarball downloaded from that release); bump it together with the version in the URL.
          curl -sSL -o "$dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Gitleaks scan
        # --verbose prints each finding (file, line, rule, redacted value) so a red job is actionable
        # without reproducing the scan locally; secrets stay redacted.
        #
        # What is scanned depends on the event. gitleaks' default is `git log --all`, and the checkout above
        # fetched every branch, so one leaked-looking literal on ANY branch used to fail gitleaks on EVERY pull
        # request (and anyone who can push a branch could block them all). A pull request now scans only its own
        # commits; a merge-queue group only its own; a push the history of the pushed commit, which is the
        # full-history scan of main; a schedule or manual run still scans every branch. The event data reaches
        # the script through env, never spliced into it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          # gitleaks 8.21.2 exits 0 ("no leaks found") when --log-opts names a commit that does not exist in the
          # checkout (a fork head on pull_request_target, an empty event field), so a bad range would pass the
          # scan unread. Every SHA must be 40 hex and present as a commit, or the job fails.
          need_commit() {
            case "$1" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
              *) echo "::error::gitleaks scan range: '$2' is not a commit SHA ('$1')" >&2; exit 1 ;;
            esac
            git cat-file -e "$1^{commit}" 2>/dev/null || { echo "::error::gitleaks scan range: $2 $1 is not in the checkout, so it cannot be scanned" >&2; exit 1; }
          }
          case "$EVENT_NAME" in
            pull_request | pull_request_target)
              need_commit "$PR_BASE" "the base"; need_commit "$PR_HEAD" "the head"
              range="$PR_BASE..$PR_HEAD" ;;
            merge_group)
              need_commit "$MG_BASE" "the group base"; need_commit "$MG_HEAD" "the group head"
              range="$MG_BASE..$MG_HEAD" ;;
            push)
              need_commit "$PUSHED_SHA" "the pushed commit"
              range="$PUSHED_SHA" ;;
            *) range="" ;;
          esac
          if [ -n "$range" ]; then
            gitleaks detect --source . --no-banner --redact --verbose --log-opts="$range"
          else
            gitleaks detect --source . --no-banner --redact --verbose
          fi

  semgrep:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    # S10/D3: pip installation removes the runner's Docker dependency. Keep the
    # user base in RUNNER_TEMP so self-hosted jobs cannot leak packages across runs.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install semgrep
        env:
          PYTHONUSERBASE: ${{ runner.temp }}/semgrep-user
        run: |
          # Both runner fleets use PEP 668 externally-managed Python. --user
          # confines the pinned package to the ephemeral PYTHONUSERBASE.
          python3 -m pip install --user --break-system-packages --quiet semgrep==1.170.0
          echo "$PYTHONUSERBASE/bin" >> "$GITHUB_PATH"

      - name: Semgrep scan
        env:
          PYTHONUSERBASE: ${{ runner.temp }}/semgrep-user
          # semgrep-core (OCaml/Eio) defaults to the io_uring backend; on some self-hosted runner
          # slots io_uring_queue_init fails with ENOMEM (memlock pressure) and the job dies with
          # "Cannot allocate memory" before scanning anything. The POSIX backend needs no io_uring.
          EIO_BACKEND: posix
        run: |
          # platform-foundations#528 (platform-request): semgrep-core (OCaml/Eio) opens
          # one io_uring ring per parallel domain in Uring.create via
          # Eio_linux.Domain_mgr.run. Every runner process on forge/atlas shares one uid
          # under systemd's default RLIMIT_MEMLOCK (Max locked memory = 8388608, 8 MiB),
          # so concurrent self-hosted jobs can exhaust that shared per-uid locked-memory
          # budget and die with "Unix_error: Cannot allocate memory io_uring_queue_init"
          # before scanning anything, even with EIO_BACKEND=posix above. --jobs 2 bounds
          # the Eio domains (and rings) this run opens. The durable fix raises
          # RLIMIT_MEMLOCK for the runner uid at the host level (tracked separately in
          # platform-foundations#528); the retry below is the bounded workflow-level
          # stopgap on top of it: at most one retry, and only for this exact memlock
          # signature. Any other non-zero exit (real findings, config errors) fails
          # immediately on the first attempt — this is not a fail-open retry.
          set -uo pipefail

          run_semgrep() {
            semgrep scan \
              --config=p/security-audit \
              --config=p/owasp-top-ten \
              --config=p/typescript \
              --error \
              --severity=ERROR \
              --jobs 2 \
              2>&1 | tee "$1"
          }

          log1="$RUNNER_TEMP/semgrep-attempt-1.log"
          if run_semgrep "$log1"; then
            exit 0
          else
            status=$?
          fi

          if ! grep -qE 'Unix_error:\s*Cannot allocate memory io_uring_queue_init' "$log1"; then
            exit "$status"
          fi

          echo "semgrep: retried once after io_uring memlock exhaustion (see platform-foundations#528)"

          log2="$RUNNER_TEMP/semgrep-attempt-2.log"
          if run_semgrep "$log2"; then
            exit 0
          else
            exit $?
          fi

  grype:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    # anchore/scan-action@v7.4.0 runs 'grype dir:.' (binary download, no Docker required)
    runs-on: [self-hosted, Linux, X64]
    # One scan pass (the findings table). The SARIF pass was dropped: nothing
    # read its output once Actions artifact storage stopped being used
    # (operator ruling 2026-09-27). 10m was tight even for a single fresh-DB pull.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Grype vulnerability scan (findings table)
        # Scans with a human-readable table. anchore/scan-action
        # prints table output back into the job log (it does not for
        # sarif/json — those go to a file only), so a failure here names the
        # package, installed version, advisory and fixed version directly in
        # the log. Before this step, that gap left GHSA-26w7-cxv4-gfx2 (astro
        # RCE, 2026-09-10) unnamed across the fleet for two days — the SARIF
        # was written to an unretained temp file and code scanning is off on
        # most repos, so the only way to learn the CVE was rerunning grype
        # locally. This step is the one that actually fails the job.
        uses: anchore/scan-action@v7.4.0
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          grype-version: v0.117.0
          # Fresh DB per job, never the Actions cache: a restored copy went stale on
          # the self-hosted fleet and grype aborted on its max-age check
          # (invoice-portal run 32390381477, forge-7, 2026-08-20).
          cache-db: false
          output-format: table

  trigger-cf-build:
    # Optional: after the gate passes, POST to the Workers Builds manual-trigger
    # endpoint to start the build immediately instead of waiting for CF Builds'
    # webhook dispatch. Skipped if cf-worker-name / cf-account-id / CF_BUILDS_TOKEN
    # aren't provided, and only runs on push to main or staging.
    if: |
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'staging') &&
      inputs.cf-worker-name != '' &&
      inputs.cf-account-id != ''
    needs: [quality, gitleaks, semgrep, grype]
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Manually trigger Cloudflare Workers build
        env:
          CF_TOKEN: ${{ secrets.CF_BUILDS_TOKEN }}
          ACCOUNT_ID: ${{ inputs.cf-account-id }}
          WORKER_NAME: ${{ inputs.cf-worker-name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "::warning::CF_BUILDS_TOKEN secret not provided — skipping manual trigger; CF will deploy via webhook (slower)."
            exit 0
          fi

          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CF_TOKEN"

          worker_tag=$(curl -fsSL -H "$AUTH" "$API/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            | jq -r '.result.tag // empty')
          if [ -z "$worker_tag" ]; then
            echo "::warning::Could not resolve worker tag for '$WORKER_NAME' in account $ACCOUNT_ID — skipping manual trigger."
            exit 0
          fi

          trigger_uuid=$(curl -fsSL -H "$AUTH" "$API/accounts/$ACCOUNT_ID/builds/workers/$worker_tag/triggers" \
            | jq -r --arg branch "$BRANCH" '[.result[] | select(.branch_includes | index($branch))] | first | .trigger_uuid // empty')
          if [ -z "$trigger_uuid" ]; then
            echo "::warning::No CF Builds trigger matches branch '$BRANCH' for worker '$WORKER_NAME' — skipping manual trigger."
            exit 0
          fi

          echo "Triggering CF Build for worker '$WORKER_NAME' on branch '$BRANCH' (trigger $trigger_uuid)"
          response=$(curl -fsSL -X POST -H "$AUTH" "$API/accounts/$ACCOUNT_ID/builds/triggers/$trigger_uuid/builds")
          if ! echo "$response" | jq -e '.success == true' > /dev/null; then
            echo "::error::CF Builds API rejected the trigger:"
            echo "$response" | jq '.errors // .'
            exit 1
          fi

          build_uuid=$(echo "$response" | jq -r '.result.build_uuid // .result.uuid // "unknown"')
          echo "::notice::CF Build started: $build_uuid"
