name: Deploy Gate (Reusable)

# Self-hosted replacement for the Workers Builds deployctl-prod trigger: on a
# main push, runs the repo's production build on the self-hosted fleet and
# deploys with the SAME provenance annotations Workers Builds stamps
# (--tag <full sha>, --message "source=<commit url> build=<uuid>"), so
# deploy-truth / verify-deploy provenance matching is unchanged. Callers are
# generated by platform-foundations when a repo sets
# deployment.workers_builds.prod_deploys: 'self-hosted'. The job runs in the
# caller repo's `production` environment (branch-locked to main), which holds
# the CF_DEPLOY_API_TOKEN environment secret.
#
# Risk-matched: callers that pass `required-journey-check` additionally refuse
# any commit whose originating pull request does not carry a successful run of
# that check on its head SHA (operating-baseline B-03).
#
# Per-target environments, a read-only dry-run, post-deploy journeys, and a
# monorepo app-directory joined this gate for M2-14 (Fronts deploying from
# growth-labs/publishing): every new input below defaults to a no-op, so an
# existing caller's run is unchanged.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      environment:
        type: string
        default: 'production'
        description: >-
          GitHub environment the job runs in, and where its CF_DEPLOY_API_TOKEN
          lives. Default keeps every existing caller on `production`, exactly
          as before this input existed.
      build-command:
        type: string
        required: true
        description: 'Production build command (the WB build_command_prod).'
      account-id:
        type: string
        required: true
        description: 'Cloudflare account ID owning the Worker.'
      wrangler-version:
        type: string
        default: '4.94.0'
        description: 'Wrangler version installed into RUNNER_TEMP for the deploy.'
      config-path:
        type: string
        default: ''
        description: >-
          Wrangler config file, relative to the repository root, for a Worker
          that does not live at the root. Empty (default) leaves the command
          byte-identical to before: wrangler discovers the nearest ./wrangler.*
          from the working directory, which is what every existing caller
          relies on. Set it for a monorepo whose deployable Worker is in a
          subdirectory (e.g. 'apps/masthead/wrangler.toml'); wrangler resolves
          `main` and every other path in the file relative to the FILE's
          directory, not to the working directory, so the build command still
          runs from the root as usual.
      app-directory:
        type: string
        default: ''
        description: >-
          The deployable app's directory relative to the repo root (e.g.
          'publications/fronts'), for a Worker built inside a monorepo. Empty
          (default) keeps the test-only-module assertion and the D1 tripwire
          running from the repo root, exactly as before this input existed.
      worker-name:
        type: string
        default: ''
        description: >-
          Worker script name. Required when `dry-run` is true, so the dry-run
          knows which live Worker to diff against.
      dry-run:
        type: boolean
        default: false
        description: >-
          Build and run every safety check exactly as for a deploy, then diff
          the built config against the live Worker instead of deploying.
          Requires `worker-name`. Default false leaves the deploy step running
          exactly as before this input existed.
      journeys-canary-url:
        type: string
        default: ''
        description: >-
          Base URL of the authenticated-browser canary that runs post-deploy
          preview journeys. The three journeys-* inputs are all-or-none; when
          set, the CALLING job must grant `id-token: write` so the gate can
          mint the OIDC token the canary verifies.
      journeys-audience:
        type: string
        default: ''
        description: >-
          OIDC audience for the post-deploy journeys canary (e.g.
          'fronts-preview-gate'). All-or-none with the other journeys-* inputs.
      journeys-target-url:
        type: string
        default: ''
        description: >-
          URL the post-deploy journeys run against (e.g.
          'https://staging.fronts.co/'). All-or-none with the other journeys-*
          inputs.
      required-journey-check:
        type: string
        default: ''
        description: >-
          Risk-matched deploy gate. When set, this deploy refuses unless the
          named check ran SUCCESSFULLY on the deployed commit itself, or --
          failing that -- on the head SHA of the pull request the deployed
          commit came from. Empty (default) preserves prior behaviour for repos
          with no journeys. A caller that sets this MUST grant
          `pull-requests: read` and `checks: read` alongside `contents: read`
          on its calling job.
      journeys-override-reason:
        type: string
        default: ''
        description: >-
          Break-glass only. A non-empty reason skips the journey gate and records
          it loudly in the job summary. Callers must wire this from a
          workflow_dispatch input ONLY, never from the push/workflow_run path, so
          an automatic deploy can never carry one.
      required-journey-app:
        type: string
        default: ''
        description: >-
          GitHub App slug that must own the required-journey-check run (e.g.
          the canary posts as 'fulcrum-platform-automation'). Empty (default)
          accepts a run from any source, exactly as before this input existed.
          When set, both the deployed-commit and the pull-request-head lookup
          only consider runs where `run.app.slug` equals this value, so a
          same-named check from an unrelated workflow or App cannot satisfy
          the gate.
      require-descends-from-live:
        type: boolean
        default: false
        description: >-
          Close the TOCTOU window between a caller's own live-tag-vs-tip
          decision and the actual deploy: immediately before deploying,
          re-read the live Worker's `workers/tag` annotation fresh and refuse
          unless it is an ancestor of (or equal to) $GITHUB_SHA. Guards
          against a stale-but-green trigger deploying older code over a
          newer commit that raced it to live in between (deploy-workflow-
          run-starvation, H1). Requires `worker-name` and a full-history
          checkout (fetch-depth: 0, already the gate's default). Default
          false preserves every existing caller's behaviour unchanged.
          Intended for the automatic workflow_run path ONLY -- an operator's
          workflow_dispatch redeploy is the escape hatch precisely for when
          automatic ancestry reasoning is wrong or needs to be overridden, so
          a caller should gate this input to true only when
          `github.event_name == 'workflow_run'`, never unconditionally. An
          empty or unrecognized (not-a-commit-of-this-repo) live tag proceeds
          with a warning, matching the caller's own equivalent escape hatch,
          rather than deadlocking every future deploy on a version that was
          pushed without --tag. A live tag that IS newer than $GITHUB_SHA
          (a faster deploy already landed) skips the deploy with a warning
          and keeps the job green -- that is the race resolving correctly,
          not a failure. Only unreadable upstream data or genuinely diverged
          history fails the job.
    secrets:
      CF_DEPLOY_API_TOKEN:
        required: true
        description: 'Cloudflare API token with Workers Scripts: Edit on the target account, stored as a production-environment secret.'

# No `permissions:` key, at workflow OR job level, deliberately.
#
# A reusable workflow that omits it inherits the CALLER job's token scopes
# verbatim, and that is the only way one pinned gate can serve both shapes of
# caller: an ordinary repo grants `contents: read` and gets exactly what it
# always got, while a member-facing repo grants `contents: read` +
# `pull-requests: read` + `checks: read` at its job level so the journey gate
# below can resolve the originating pull request and read its journey check.
# Declaring the wider set here instead would push scopes at every existing
# caller that grants only `contents: read` -- the fleet-wide deploy path -- for
# the benefit of the handful that need them.

# Serialize deploys per repo and NEVER cancel one mid-flight: an interrupted
# deploy is worse than a queued one. Later main pushes wait their turn.
#
# A non-production `environment` gets its own group: GitHub keeps only one
# PENDING run per concurrency group and replaces an older pending run with a
# newer one, so a repo with two deploy targets (e.g. fronts-staging and
# fronts-production) needs two groups, or a queued staging dispatch would
# silently displace a queued production one (and vice versa). A default
# caller's group string is byte-identical to before this changed.
concurrency:
  group: deploy-gate-${{ github.repository }}${{ inputs.environment != 'production' && format('-{0}', inputs.environment) || '' }}
  cancel-in-progress: false

jobs:
  deploy:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      # Input sanity before anything else runs, so a misconfigured caller
      # fails in seconds instead of after a fleet build. A tokenless build is
      # the sharpest trap: site configs branch on `CI && !CLOUDFLARE_API_TOKEN`
      # and fall back to the node prerender stub (Fronts' is
      # src/lib/cloudflare-workers-build.ts), which the "assert no test-only
      # modules" step below cannot see because the stub is not under
      # src/lib/testing/ -- it ships a Worker with no bindings, silently.
      - name: Preflight
        env:
          CF_DEPLOY_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry-run }}
          WORKER_NAME: ${{ inputs.worker-name }}
          JOURNEYS_CANARY_URL: ${{ inputs.journeys-canary-url }}
          JOURNEYS_AUDIENCE: ${{ inputs.journeys-audience }}
          JOURNEYS_TARGET_URL: ${{ inputs.journeys-target-url }}
        run: |
          set -euo pipefail
          if [ -z "$CF_DEPLOY_API_TOKEN" ]; then
            echo "::error::CF_DEPLOY_API_TOKEN is empty for environment '$ENVIRONMENT' -- a tokenless build selects the node prerender stub (CI && !CLOUDFLARE_API_TOKEN) and ships a Worker with no bindings"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ] && [ -z "$WORKER_NAME" ]; then
            echo "::error::dry-run is true but worker-name is empty -- the dry-run needs a live Worker to diff against"
            exit 1
          fi
          present=0
          missing=()
          for pair in "journeys-canary-url:$JOURNEYS_CANARY_URL" "journeys-audience:$JOURNEYS_AUDIENCE" "journeys-target-url:$JOURNEYS_TARGET_URL"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done
          if [ "$present" -gt 0 ] && [ "$present" -lt 3 ]; then
            echo "::error::the journeys-* inputs are all-or-none; missing: ${missing[*]} -- check for an empty vars.* in the caller"
            exit 1
          fi

      # Risk-matched deploy gate (operating-baseline B-03). On 2026-09-14 every
      # signed-in member got a 500 on the newest Fronts videos for ~4.5 hours:
      # the change that caused it had a preview, and nothing required the
      # preview's authenticated journeys to pass before it reached production.
      # This step is that requirement. It resolves the pull request the deployed
      # commit came from and refuses unless the named journey check concluded
      # SUCCESS on that PR's head SHA (or, more directly, on the deployed
      # commit itself -- see below). Runs right after Preflight: a failing
      # journey must cost zero fleet build minutes.
      - name: Preview journeys gate
        if: inputs.required-journey-check != '' && !inputs.dry-run
        uses: actions/github-script@v8
        env:
          DEPLOY_SHA: ${{ github.sha }}
          REQUIRED_CHECK: ${{ inputs.required-journey-check }}
          OVERRIDE_REASON: ${{ inputs.journeys-override-reason }}
          REQUIRED_APP: ${{ inputs.required-journey-app }}
        with:
          script: |
            const sha = process.env.DEPLOY_SHA
            const name = process.env.REQUIRED_CHECK
            const override = (process.env.OVERRIDE_REASON || '').trim()
            const requiredApp = (process.env.REQUIRED_APP || '').trim()
            const byRequiredApp = (run) => !requiredApp || run.app?.slug === requiredApp
            const { owner, repo } = context.repo

            const refuse = async (title, lines) => {
              core.summary.addHeading(`Deploy refused - ${title}`, 3)
              core.summary.addRaw(lines.join('\n'))
              await core.summary.write()
              core.error(lines.join('\n'), { title: `Deploy refused - ${title}` })
              core.setFailed(`${title}: the preview journeys for ${sha} did not pass.`)
            }

            if (override) {
              const lines = [
                `Journey gate BYPASSED for \`${sha}\` by explicit operator override.`,
                '',
                `Reason: ${override}`,
                '',
                `Required check \`${name}\` was NOT consulted. This deploy is unverified against the member money paths.`,
              ]
              core.summary.addHeading('Deploy journey gate overridden', 3)
              core.summary.addRaw(lines.join('\n'))
              await core.summary.write()
              core.warning(`Preview journeys gate overridden: ${override}`)
              return
            }

            // The post-deploy staging journeys (step "Post-deploy journeys")
            // run on the exact commit that later deploys to production --
            // stronger evidence than a PR preview, since nothing can change
            // between that check and this deploy. The PR-head path below
            // stays for callers that journey their previews instead (e.g.
            // fulcrum-labs/fronts pr-preview.yml, whose journeys check lands
            // on the PR head sha, never on a main commit, because that repo
            // is squash-merge only).
            const deployShaRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: sha,
              check_name: name,
              per_page: 100,
            })
            const deployShaCompleted = deployShaRuns.filter((run) => run.status === 'completed' && byRequiredApp(run))
            const deployShaFinishedAt = (run) => new Date(run.completed_at || run.started_at || 0).getTime()
            deployShaCompleted.sort((a, b) => deployShaFinishedAt(b) - deployShaFinishedAt(a))

            if (deployShaCompleted.length > 0) {
              const latestOnDeploySha = deployShaCompleted[0]
              if (latestOnDeploySha.conclusion === 'success') {
                core.summary.addHeading('Preview journeys passed', 3)
                core.summary.addRaw([
                  `\`${name}\` succeeded on the deployed commit \`${sha}\`.`,
                  '',
                  `Run: ${latestOnDeploySha.html_url}`,
                ].join('\n'))
                await core.summary.write()
                core.info(`Journey gate satisfied by ${latestOnDeploySha.html_url} (deployed commit)`)
                return
              }
              return refuse(`journeys ${latestOnDeploySha.conclusion} on the deployed commit`, [
                `Check \`${name}\` concluded **${latestOnDeploySha.conclusion}** on the deployed commit \`${sha}\`.`,
                '',
                `Run: ${latestOnDeploySha.html_url}`,
                latestOnDeploySha.output?.title ? `\nTitle: ${latestOnDeploySha.output.title}` : '',
                latestOnDeploySha.output?.summary ? `\n\n${latestOnDeploySha.output.summary}` : '',
                '',
                'A member-facing site does not deploy on failed journeys.',
              ].filter(Boolean))
            }

            // No completed run on the deployed commit itself -- fall back to
            // the pull-request head, unchanged from before this check existed.
            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha, per_page: 100 },
            )
            const merged = associated.filter((pr) => pr.merged_at)
            if (merged.length === 0) {
              return refuse('no pull request', [
                `No merged pull request is associated with \`${sha}\`.`,
                '',
                'A member-facing site deploys only from a reviewed pull request whose',
                `preview journeys passed. Direct pushes to the default branch, and`,
                'commits whose PR was force-pushed away, cannot be journey-verified.',
                '',
                'Open a pull request for this change, let its journeys run, and merge it.',
              ])
            }
            merged.sort((a, b) => new Date(b.merged_at).getTime() - new Date(a.merged_at).getTime())
            const pr = merged[0]
            const head = pr.head.sha

            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: head,
              check_name: name,
              per_page: 100,
            })
            const completed = runs.filter((run) => run.status === 'completed' && byRequiredApp(run))
            if (completed.length === 0) {
              return refuse('journeys never ran', [
                `Check \`${name}\` has no completed run on \`${head}\` (PR #${pr.number}, head of the pull request that produced \`${sha}\`).`,
                '',
                'The journeys either never started or are still running. A deploy may',
                'not outrun the gate that proves it safe.',
                '',
                `Re-run the preview workflow on PR #${pr.number}, then re-dispatch this deploy.`,
              ])
            }
            const finishedAt = (run) => new Date(run.completed_at || run.started_at || 0).getTime()
            completed.sort((a, b) => finishedAt(b) - finishedAt(a))
            const latest = completed[0]

            if (latest.conclusion !== 'success') {
              return refuse(`journeys ${latest.conclusion}`, [
                `Check \`${name}\` concluded **${latest.conclusion}** on \`${head}\` (PR #${pr.number}).`,
                '',
                `Run: ${latest.html_url}`,
                latest.output?.title ? `\nTitle: ${latest.output.title}` : '',
                latest.output?.summary ? `\n\n${latest.output.summary}` : '',
                '',
                'A member-facing site does not deploy on failed journeys. Fix the',
                'journey failure and merge the fix, or -- only for an incident --',
                're-dispatch this deploy with an explicit override reason.',
              ].filter(Boolean))
            }

            core.summary.addHeading('Preview journeys passed', 3)
            core.summary.addRaw([
              `\`${name}\` succeeded on \`${head}\` (PR #${pr.number}).`,
              '',
              `Run: ${latest.html_url}`,
            ].join('\n'))
            await core.summary.write()
            core.info(`Journey gate satisfied by ${latest.html_url}`)

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = "10.28.0"
          package_json = Path("package.json")
          if package_json.exists():
            data = json.loads(package_json.read_text())
            package_manager = data.get("packageManager")
            if isinstance(package_manager, str) and package_manager.startswith("pnpm@"):
              version = package_manager.split("@", 1)[1]
            else:
              volta = data.get("volta")
              if isinstance(volta, dict):
                volta_pnpm = volta.get("pnpm")
                if isinstance(volta_pnpm, str) and volta_pnpm:
                  version = volta_pnpm

          print(f"version={version}")
          PY

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Guard pnpm runner isolation
        run: |
          case "${PNPM_HOME:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::PNPM_HOME must be under RUNNER_TEMP on self-hosted runners; got '${PNPM_HOME:-<unset>}'"
              exit 1
              ;;
          esac

          if [ -e "$HOME/setup-pnpm" ]; then
            echo "::warning::Removing stale home-level pnpm setup from prior self-hosted jobs"
            # Best-effort only. Concurrent jobs on the same self-hosted host share
            # $HOME, so two runs can race this delete and rm exits non-zero with
            # "Directory not empty" — which, under `bash -e`, failed the whole build.
            # Correctness does not depend on this: PNPM_HOME is asserted to live under
            # RUNNER_TEMP by the hard check above, so leftover $HOME state is unused.
            rm -rf "$HOME/setup-pnpm" 2>/dev/null || \
              echo "::warning::Could not fully remove $HOME/setup-pnpm (concurrent job on this host); continuing because PNPM_HOME is pinned under RUNNER_TEMP"
          fi

          # pnpm 10 reads the lowercase npm_config_* form only, and pnpm 11 reads
          # pnpm_config_* only; the uppercase NPM_CONFIG_STORE_DIR this step used
          # to export was read by neither, so every job on a host silently shared
          # the runner unit's npm_config_store_dir (/var/cache/ci/pnpm) and their
          # installs raced one store (ERR_PNPM_ENOENT copyfile / READ_FROM_STORE,
          # 2026-09-25/26). Export both spellings pnpm actually reads.
          echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Production build
        env:
          # The build is AUTHENTICATED, not just the deploy.
          #
          # Site configs branch on `CI && !CLOUDFLARE_API_TOKEN` to decide
          # whether a build can reach Cloudflare: without a token they fall back
          # to the node prerenderer and alias `cloudflare:workers` to a local
          # TEST stub. That fallback is correct for the tokenless CI gate, whose
          # artifact is discarded — and catastrophic here, where the artifact is
          # what ships. casualcriminalist deployed that stub to production: its
          # `env` proxies an empty object, so the live Worker saw NO bindings at
          # all (SITE_DB undefined → every article route 500, listing pages
          # rendered zero articles) while the build and the deploy both stayed
          # green. Handing the build the same token the deploy already uses puts
          # this job on the identical code path Cloudflare Builds takes for every
          # other channel site.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        run: ${{ inputs.build-command }}

      # Belt and braces for the failure above: even with the token present, a
      # test-only module must never reach a deployed Worker. `src/lib/testing/**`
      # is the fleet's conventional home for those, so its appearance in the
      # emitted server bundle fails the deploy LOUDLY instead of shipping a
      # silently inert site. Skipped when a repo emits no dist/server (non-Astro
      # callers) rather than failing them on a directory they never produce.
      - name: Assert no test-only modules in the deployed bundle
        working-directory: ${{ inputs.app-directory || '.' }}
        run: |
          set -euo pipefail
          if [ ! -d dist/server ]; then
            echo "No dist/server directory; skipping test-module assertion."
            exit 0
          fi
          if grep -rlF 'src/lib/testing/' dist/server > /tmp/test-module-hits.txt 2>/dev/null; then
            echo "::error::Test-only modules were bundled into the deployable Worker:"
            cat /tmp/test-module-hits.txt
            echo "The build took a tokenless/test code path. Do NOT deploy this artifact."
            exit 1
          fi
          echo "OK: dist/server references no src/lib/testing/ module."

      - name: Install wrangler
        run: |
          WRANGLER_DIR="$RUNNER_TEMP/wrangler-install"
          mkdir -p "$WRANGLER_DIR"
          npm install --prefix "$WRANGLER_DIR" --no-audit --no-fund wrangler@${{ inputs.wrangler-version }}
          WRANGLER_BIN="$WRANGLER_DIR/node_modules/.bin/wrangler"
          "$WRANGLER_BIN" --version
          echo "WRANGLER_BIN=$WRANGLER_BIN" >> "$GITHUB_ENV"

      # Migrations that merge but never reach the live D1 ledger are a silent
      # schema gap: deployed code queries columns that do not exist. Fronts hit
      # this twice on 2026-09-07 (analytics 0006 skipped in the ledger while
      # 0007/0008 were present; repo 0073/0074 merged and deployed against a
      # database without their columns). Repos whose D1 publisher is suspended
      # (.publication/d1-migrations.json) get a pre-deploy check: every
      # migration file in the repo and in every wrangler `migrations_dir` must
      # have a ledger row, or deployment is blocked with the missing names.
      # Checking after deployment already shipped code against missing schema.
      # This remains read-only: the suspended migration publisher is unchanged.
      #
      # app-directory matters here: from a monorepo root this step used to be
      # skipped entirely, silently, because .publication/d1-migrations.json
      # lives under the app's own directory. From e.g. publications/fronts it
      # checks 115 files -- the 105 Fronts migrations plus
      # node_modules/@growth-labs/analytics/migrations.
      - name: D1 migration ledger tripwire
        if: hashFiles(inputs.app-directory != '' && format('{0}/.publication/d1-migrations.json', inputs.app-directory) || '.publication/d1-migrations.json') != ''
        working-directory: ${{ inputs.app-directory || '.' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          APP_DIRECTORY: ${{ inputs.app-directory }}
          GATE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # A `-staging` (or bare `staging`) environment (the caller's
          # deploy-staging job, e.g. `fronts-staging`) reads
          # `.staging.databaseName` out of platform-foundations' extended
          # `.publication/d1-migrations.json` once a project opts into
          # d1Role.staging (fulcrum-labs/platform-foundations#1006). No new
          # input: this branches on `environment`, which every caller
          # already sets. A `-production` environment always reads the
          # unchanged top-level `databaseName`, exactly as before this
          # existed. Falls back to the top-level databaseName on a staging
          # environment too when `.staging` is absent (every project today)
          # -- loudly, via the ::notice below, never silently.
          DB_NAME="$(node -p "
            const data = JSON.parse(require('fs').readFileSync('.publication/d1-migrations.json', 'utf8'));
            const env = process.env.GATE_ENVIRONMENT || 'production';
            const isStaging = env === 'staging' || env.endsWith('-staging');
            (isStaging && data.staging && data.staging.databaseName) || data.databaseName || '';
          ")"
          if [ -z "$DB_NAME" ]; then
            echo "::error::.publication/d1-migrations.json has no databaseName" >&2
            exit 1
          fi

          # The staging object itself (enabled/reconciliation/catchUpUntil),
          # empty when this isn't a staging environment or the project
          # hasn't opted in yet -- handed to the tripwire heredoc below via
          # D1_STAGING_JSON so the resolver here and the tripwire agree on
          # catch-up state without re-reading the file twice under different
          # assumptions.
          D1_STAGING_JSON="$(node -p "
            const data = JSON.parse(require('fs').readFileSync('.publication/d1-migrations.json', 'utf8'));
            const env = process.env.GATE_ENVIRONMENT || 'production';
            const isStaging = env === 'staging' || env.endsWith('-staging');
            isStaging && data.staging ? JSON.stringify(data.staging) : '';
          ")"

          # The notice fires whenever the STAGING BRANCH didn't supply a
          # name -- not merely when D1_STAGING_JSON is empty. A manifest
          # that declares `staging: { enabled: false }` with no
          # databaseName makes D1_STAGING_JSON non-empty (the object
          # exists) while DB_NAME still silently falls through to prod;
          # checking D1_STAGING_JSON emptiness alone missed exactly that
          # case and stayed silent about it.
          NEEDS_FALLBACK_NOTICE="$(node -p "
            const data = JSON.parse(require('fs').readFileSync('.publication/d1-migrations.json', 'utf8'));
            const env = process.env.GATE_ENVIRONMENT || 'production';
            const isStaging = env === 'staging' || env.endsWith('-staging');
            (isStaging && !(data.staging && data.staging.databaseName)) ? '1' : '';
          ")"
          if [ -n "$NEEDS_FALLBACK_NOTICE" ]; then
            echo "::notice::$GATE_ENVIRONMENT has no d1Role.staging yet; checking the production ledger ($DB_NAME)"
          fi

          # reviewer-foundry on #59: staging.databaseId was carried into
          # D1_STAGING_JSON but never actually used -- the ledger read below
          # still resolved DB_NAME by NAME alone, the same class of gap
          # #58(ii) closed for the apply workflow. Same technique here: a
          # generated, minimal --config pins wrangler to the verified id
          # instead of letting the consumer's own wrangler.toml/json decide.
          #
          # Gated on NEEDS_FALLBACK_NOTICE being EMPTY, not merely on
          # D1_STAGING_JSON being non-empty: a staging block that declares
          # databaseId but no databaseName still leaves DB_NAME resolved to
          # PROD's name (the fallback above), and generating a config from
          # THAT combination would map prod's name to staging's uuid --
          # reading staging while the notice claims prod. Only bind the
          # config when the staging branch genuinely supplied its own name
          # (the exact condition NEEDS_FALLBACK_NOTICE already computed).
          D1_CONFIG_ARGS=()
          if [ -z "$NEEDS_FALLBACK_NOTICE" ] && [ -n "$D1_STAGING_JSON" ]; then
            # Written under $RUNNER_TEMP, not a self-managed mkdtemp path
            # (contrast fulcrum-labs/shared-workflows#58's Node script,
            # which falls back to the OS tmpdir and so needed its own
            # explicit rmSync): this one file is cleaned by the runner at
            # job end along with the rest of $RUNNER_TEMP, nothing here
            # removes it itself.
            D1_CONFIG_PATH="$(D1_STAGING_JSON="$D1_STAGING_JSON" DB_NAME="$DB_NAME" node -p "
              const fs = require('fs');
              const path = require('path');
              const staging = JSON.parse(process.env.D1_STAGING_JSON);
              const configPath = staging.databaseId
                ? path.join(process.env.RUNNER_TEMP || '/tmp', 'd1-tripwire-config.json')
                : '';
              if (configPath) {
                fs.writeFileSync(configPath, JSON.stringify({
                  d1_databases: [{ binding: 'DB', database_name: process.env.DB_NAME, database_id: staging.databaseId }],
                }));
              }
              configPath;
            ")"
            if [ -n "$D1_CONFIG_PATH" ]; then
              D1_CONFIG_ARGS=(--config "$D1_CONFIG_PATH")
            fi
          fi

          if ! "$WRANGLER_BIN" d1 execute "$DB_NAME" "${D1_CONFIG_ARGS[@]}" --remote --json \
              --command "SELECT name FROM d1_migrations" > "$RUNNER_TEMP/d1-ledger.json"; then
            echo "::error::D1 ledger read failed for $DB_NAME — CF_DEPLOY_API_TOKEN needs D1:Read on the account" >&2
            exit 1
          fi
          D1_LEDGER_JSON="$RUNNER_TEMP/d1-ledger.json" D1_STAGING_JSON="$D1_STAGING_JSON" D1_DB_NAME="$DB_NAME" node - <<'D1_LEDGER_TRIPWIRE'
          const fs = require('node:fs')
          const path = require('node:path')
          const raw = JSON.parse(fs.readFileSync(process.env.D1_LEDGER_JSON, 'utf8'))
          const rows = Array.isArray(raw) ? (raw[0]?.results ?? []) : (raw.results ?? [])
          const ledger = new Set(rows.map((row) => String(row.name)))
          const dirs = new Set()
          if (fs.existsSync('migrations')) dirs.add('migrations')
          for (const config of ['wrangler.toml', 'wrangler.jsonc', 'wrangler.json']) {
            if (!fs.existsSync(config)) continue
            const text = fs.readFileSync(config, 'utf8')
            for (const match of text.matchAll(/migrations_dir\s*[=:]\s*["']([^"']+)["']/g)) {
              if (fs.existsSync(match[1])) dirs.add(match[1])
            }
          }
          const missing = []
          let checked = 0
          for (const dir of dirs) {
            for (const file of fs.readdirSync(dir).filter((name) => name.endsWith('.sql')).sort()) {
              checked += 1
              if (!ledger.has(file)) missing.push(path.posix.join(dir, file))
            }
          }
          // Catch-up (fulcrum-labs/platform-foundations#1006) is a bounded,
          // declared tolerance for missing staging migrations -- never for
          // prod, never past its own catchUpUntil, and never when staging
          // has already been declared reconciled (exact). Any of those
          // three falls straight through to the same hard-error path a
          // fully-reconciled ledger always had.
          const staging = process.env.D1_STAGING_JSON ? JSON.parse(process.env.D1_STAGING_JSON) : null
          const inUnexpiredCatchUp = Boolean(
            staging
            && staging.enabled
            && staging.reconciliation === 'catch-up'
            && staging.catchUpUntil
            && new Date(staging.catchUpUntil).getTime() > Date.now(),
          )
          if (missing.length > 0) {
            if (inUnexpiredCatchUp) {
              const summary = `staging D1 in catch-up until ${staging.catchUpUntil}: ${missing.length} of ${checked} migrations missing`
              console.log(`::warning::${summary}`)
              console.log(summary)
              if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`)
              process.exit(0)
            }
            for (const file of missing) console.log(`::error::D1 migration never applied to the live ledger — ${file}`)
            process.exit(1)
          }
          if (process.env.APP_DIRECTORY && checked === 0) {
            console.log('::error::zero migration files is unrun, never a pass')
            process.exit(1)
          }
          console.log(`D1 migration ledger tripwire: ${checked} migration file(s) across ${dirs.size} dir(s), all present in the ledger (${ledger.size} rows) for ${process.env.D1_DB_NAME}`)
          D1_LEDGER_TRIPWIRE

      - name: Refuse a deploy older than the live tag (re-checked immediately before deploy)
        id: require-descends-from-live
        if: ${{ !inputs.dry-run && inputs.require-descends-from-live }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          WORKER: ${{ inputs.worker-name }}
        run: |
          set -euo pipefail
          if [ -z "$WORKER" ]; then
            echo "::error::require-descends-from-live is true but worker-name is empty -- the check needs a live Worker to read" >&2
            exit 1
          fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"

          # Every GET asserted `success`, loudly, rather than let a malformed
          # or throttled response fall through to a quiet "proceed" -- an
          # upstream failure here must refuse the deploy, never wave it
          # through unchecked.
          DEPLOYMENTS_JSON="$RUNNER_TEMP/require-descends-live-deployments.json"
          if ! curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/deployments" > "$DEPLOYMENTS_JSON"; then
            echo "::error::failed to read live deployments for $WORKER -- refusing to deploy without confirming ancestry" >&2
            exit 1
          fi
          LIVE_VERSION_ID=$(node -e "
            const fs = require('node:fs')
            const raw = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'))
            if (raw.success !== true) { console.error('::error::deployments read returned success=false'); process.exit(1) }
            const deployments = raw.result && raw.result.deployments ? raw.result.deployments : []
            if (deployments.length === 0) { console.error('::error::no deployments found for ' + process.argv[2]); process.exit(1) }
            const sorted = deployments.slice().sort((a, b) => new Date(b.created_on).getTime() - new Date(a.created_on).getTime())
            const versions = sorted[0].versions || []
            if (versions.length !== 1) { console.error('::error::live deployment is not a single 100% version (' + versions.length + ' version(s)) -- refusing until it settles'); process.exit(1) }
            process.stdout.write(versions[0].version_id)
          " "$DEPLOYMENTS_JSON" "$WORKER")
          VERSION_JSON="$RUNNER_TEMP/require-descends-live-version.json"
          if ! curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/versions/$LIVE_VERSION_ID" > "$VERSION_JSON"; then
            echo "::error::failed to read live version $LIVE_VERSION_ID -- refusing to deploy without confirming ancestry" >&2
            exit 1
          fi
          LIVE_TAG=$(node -e "
            const fs = require('node:fs')
            const raw = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'))
            if (raw.success !== true) { console.error('::error::version read returned success=false'); process.exit(1) }
            const version = raw.result || {}
            process.stdout.write(((version.annotations || {})['workers/tag']) || '')
          " "$VERSION_JSON")
          # Empty and foreign both mean "nothing usable to compare ancestry
          # against" -- treated the SAME as the caller's own `changes` job
          # decision (its "not a commit of this repository" escape hatch),
          # not as a refusal. A live version deployed without --tag (a
          # dashboard action, a manual `wrangler deploy` outside this gate)
          # would otherwise permanently deadlock every future gated deploy,
          # including the operator's own workflow_dispatch escape hatch.
          if [ -z "$LIVE_TAG" ]; then
            echo "::warning::live version $LIVE_VERSION_ID has no workers/tag annotation -- nothing to compare ancestry against, proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$LIVE_TAG" | grep -Eq '^[0-9a-f]{40}$' || ! git cat-file -e "$LIVE_TAG^{commit}" 2>/dev/null; then
            echo "::warning::live tag $LIVE_TAG is not a commit of this repository -- nothing to compare ancestry against, proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$LIVE_TAG" "$GITHUB_SHA"; then
            echo "live tag $LIVE_TAG confirmed an ancestor of $GITHUB_SHA immediately before deploy" >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE_TAG"; then
            # Superseded-at-deploy-time is the CORRECT outcome of a race (a
            # faster trigger deployed a newer commit while this one was still
            # in flight), not a failure -- stays green: a warning, a summary
            # line, and an output the "Deploy with provenance" step below
            # skips itself on, never a red job for behaving correctly.
            echo "::warning::skipping deploy of $GITHUB_SHA: live tag $LIVE_TAG is NEWER than it (another deploy landed after this one was queued)"
            echo "superseded at deploy time: live tag \`$LIVE_TAG\` is newer than \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diverged history should never happen on linear main; this is the
          # one case worth staying red for, alongside an unreadable API read
          # above -- refusing to guess a direction is the correct failure.
          echo "::error::refusing to deploy $GITHUB_SHA: live tag $LIVE_TAG shares no ancestry with it (diverged history)" >&2
          exit 1

      - name: Deploy with provenance
        # steps.require-descends-from-live.outputs.proceed is empty (never
        # 'false') whenever that step didn't run at all -- require-descends-
        # from-live false (every caller today) or a dry-run -- so this stays
        # exactly as before for them. It is 'false' only on the one
        # deliberate, correct skip: superseded-at-deploy-time (C2). Any other
        # outcome of that step either falls through here as 'true' or has
        # already failed the job outright (unreadable API, diverged history).
        if: ${{ !inputs.dry-run && steps.require-descends-from-live.outputs.proceed != 'false' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          # Read through env, never interpolated into the script body, so a
          # caller's value is data and can never become shell.
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          COMMIT_SHA="$GITHUB_SHA"
          printf "%s\n" "$COMMIT_SHA" | grep -Eq "^[0-9a-f]{40}$" \
            || { echo "::error::invalid deploy commit SHA" >&2; exit 1; }
          BUILD_UUID="actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Unset config-path appends nothing, so the command every existing
          # caller runs is unchanged. Set-but-missing fails HERE with the path
          # named, rather than letting wrangler fall back to discovery and
          # deploy some other Worker under this repo's provenance annotations.
          DEPLOY_ARGS=(deploy)
          if [ -n "${CONFIG_PATH:-}" ]; then
            [ -f "$CONFIG_PATH" ] || {
              echo "::error::config-path '$CONFIG_PATH' does not exist in this repository" >&2
              exit 1
            }
            DEPLOY_ARGS+=(--config "$CONFIG_PATH")
          fi
          DEPLOY_ARGS+=(
            --tag "$COMMIT_SHA"
            --message "source=https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA} build=${BUILD_UUID}"
          )
          "$WRANGLER_BIN" "${DEPLOY_ARGS[@]}"
          {
            echo "### Deployed"
            echo ""
            echo "- commit: \`${COMMIT_SHA}\`"
            echo "- build: \`${BUILD_UUID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Mirrors fulcrum-labs/fronts pr-preview.yml "Dispatch authenticated
      # preview journeys" (frozen; that workflow keeps its own PR-shaped
      # payload with `source` unset). This is the deploy-shaped sibling: it
      # dispatches on the commit that just deployed, not a PR head, so the
      # Preview journeys gate above can later accept a check on the deployed
      # commit itself (operating-baseline B-03, honestly this time: the sha
      # that reaches production is the sha the journeys actually ran against).
      # Unlike the PR-path dispatch, this step fails outright on a non-success
      # classification -- the calling job needs to go red on the run that
      # just shipped a regression, not only on some later deploy's gate.
      - name: Post-deploy journeys
        # Must not run when the deploy itself was skipped as superseded
        # (require-descends-from-live's proceed=false) -- otherwise this
        # tests the newer live version that already deployed under THIS
        # run's (older) SHA, a false-positive-shaped canary run.
        if: ${{ !inputs.dry-run && inputs.journeys-audience != '' && steps.require-descends-from-live.outputs.proceed != 'false' }}
        env:
          JOURNEYS_CANARY_URL: ${{ inputs.journeys-canary-url }}
          JOURNEYS_AUDIENCE: ${{ inputs.journeys-audience }}
          JOURNEYS_TARGET_URL: ${{ inputs.journeys-target-url }}
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${JOURNEYS_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg headSha "$GITHUB_SHA" \
            --arg previewUrl "$JOURNEYS_TARGET_URL" \
            --argjson workflowRunId "$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '{source: "deploy", repository: $repository, headSha: $headSha, previewUrl: $previewUrl, workflowRunId: $workflowRunId, workflowRunAttempt: $workflowRunAttempt, privateVideoProofs: true}')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error \
            --max-time 540 \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "${JOURNEYS_CANARY_URL%/}/preview-journeys")"
          result="$(cat "$response_file")"
          if [[ ! "$http_code" =~ ^2 ]]; then
            worker_error="$(jq -r '.error // "unknown error"' <<<"$result" 2>/dev/null || echo 'invalid JSON response')"
            echo "::error::Preview canary returned HTTP ${http_code}: ${worker_error}"
            exit 1
          fi
          jq -e '.checkUrl and .classification' <<<"$result" > /dev/null

          classification="$(jq -r '.classification' <<<"$result")"
          check_url="$(jq -r '.checkUrl' <<<"$result")"
          {
            echo "Fronts preview gate: ${classification}"
            echo "Check: ${check_url}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$classification" != "success" ]; then
            echo "::error::Post-deploy journeys did not pass -- classification=${classification} (${check_url})"
            exit 1
          fi

      # A dry-run proves what a deploy WOULD change instead of just that it
      # would build: wrangler's own --dry-run only checks the bundle compiles,
      # it never compares against the live Worker. This step does that
      # comparison, read-only, against the four Cloudflare endpoints that
      # together describe a Worker's live shape (bindings/settings, crons,
      # workers.dev/previews, and the active deployment -- the rollback
      # target). It never calls anything that mutates the Worker.
      - name: Dry-run binding diff
        if: ${{ inputs.dry-run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          WORKER: ${{ inputs.worker-name }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail

          # The diff reads the generated JSON config, not the wrangler.toml
          # source -- an explicit limitation, never a silent skip, because a
          # dry-run that quietly compared the wrong file would be worse than
          # one that refuses to run.
          case "${CONFIG_PATH:-}" in
            *.json|*.jsonc) ;;
            *)
              echo "::error::the dry-run diff reads the generated JSON config; got \`${CONFIG_PATH:-<empty>}\`"
              exit 1
              ;;
          esac
          [ -f "$CONFIG_PATH" ] || {
            echo "::error::config-path '$CONFIG_PATH' does not exist in this repository" >&2
            exit 1
          }

          "$WRANGLER_BIN" deploy --dry-run --outdir "$RUNNER_TEMP/dry-run" --config "$CONFIG_PATH" \
            | tee "$RUNNER_TEMP/dry-run-log.txt"

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"

          # All GETs, all read-only. Each response is asserted `success` here,
          # loudly, rather than let a malformed or throttled response reach
          # the diff script as if it were live truth.
          fetch() {
            local path="$1" out="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API$path" > "$out"
            if [ "$(node -p "JSON.parse(require('fs').readFileSync('$out','utf8')).success === true")" != "true" ]; then
              echo "::error::$path did not report success -- $(cat "$out")"
              exit 1
            fi
          }

          fetch "/settings" "$RUNNER_TEMP/live-settings.json"
          fetch "/schedules" "$RUNNER_TEMP/live-schedules.json"
          fetch "/subdomain" "$RUNNER_TEMP/live-subdomain.json"
          fetch "/deployments" "$RUNNER_TEMP/live-deployments.json"

          # Per-version `workers/tag` annotation for every version in the
          # newest deployment, so the summary can show the rollback target by
          # commit sha, not just by opaque version id.
          echo '{}' > "$RUNNER_TEMP/live-version-tags.json"
          # version_id is API-sourced data, not a literal -- read the deployments
          # path through env, never interpolated into the script body, same rule
          # as the version-tag script below.
          #
          # Every statement is semicolon-terminated. Without it, ASI does not
          # break a statement before a line starting with `(`: the array-sort
          # result (`)[0]`) would otherwise be parsed as a call --
          # `...[0](newest?.versions ...)` -- reading `newest` inside its own
          # initializer (ReferenceError, TDZ). See growth-labs/publishing run
          # 35916382952 and .github/scripts/test-deploy-gate.mjs.
          version_ids="$(DEPLOYMENTS_JSON="$RUNNER_TEMP/live-deployments.json" node -p "
            const d = JSON.parse(require('fs').readFileSync(process.env.DEPLOYMENTS_JSON, 'utf8')).result?.deployments ?? [];
            const newest = [...d].sort((a, b) => new Date(b.created_on || 0) - new Date(a.created_on || 0))[0];
            (newest?.versions ?? []).map((v) => v.version_id).join('\n');
          ")"
          if [ -n "$version_ids" ]; then
            while IFS= read -r version_id; do
              [ -n "$version_id" ] || continue
              fetch "/versions/$version_id" "$RUNNER_TEMP/live-version-current.json"
              # version_id is API-sourced data, not a literal -- read through
              # env, never interpolated into the script body, same rule as a
              # caller-provided value.
              VERSION_ID="$version_id" \
              TAGS_PATH="$RUNNER_TEMP/live-version-tags.json" \
              VERSION_PATH="$RUNNER_TEMP/live-version-current.json" \
              node -e "
                const fs = require('node:fs')
                const tags = JSON.parse(fs.readFileSync(process.env.TAGS_PATH, 'utf8'))
                const version = JSON.parse(fs.readFileSync(process.env.VERSION_PATH, 'utf8')).result
                tags[process.env.VERSION_ID] = version?.annotations?.['workers/tag'] ?? 'unknown'
                fs.writeFileSync(process.env.TAGS_PATH, JSON.stringify(tags))
              "
            done <<<"$version_ids"
          fi

          CONFIG_JSON="$CONFIG_PATH" \
          SETTINGS_JSON="$RUNNER_TEMP/live-settings.json" \
          SCHEDULES_JSON="$RUNNER_TEMP/live-schedules.json" \
          SUBDOMAIN_JSON="$RUNNER_TEMP/live-subdomain.json" \
          DEPLOYMENTS_JSON="$RUNNER_TEMP/live-deployments.json" \
          VERSION_TAGS_JSON="$RUNNER_TEMP/live-version-tags.json" \
          node - <<'BINDING_DIFF' | tee -a "$GITHUB_STEP_SUMMARY"
          // Diffs a built wrangler config against a live Worker's settings,
          // schedules and subdomain, so a dry-run proves what a real deploy
          // would change instead of just that it *would deploy*. Ported from
          // fronts-deploy-design-evidence/binding-diff.mjs and extended: an
          // unhandled binding class fails loudly rather than being silently
          // skipped, and settings/crons/workers_dev join the comparison,
          // sourced from wrangler's own config-schema.json (RawConfig) so the
          // "other binding classes" list isn't a guess.
          const fs = require('node:fs')
          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))

          const built = readJson(process.env.CONFIG_JSON)
          const settingsResp = readJson(process.env.SETTINGS_JSON)
          const live = settingsResp.result
          const schedulesResp = readJson(process.env.SCHEDULES_JSON)
          const subdomainResp = readJson(process.env.SUBDOMAIN_JSON)
          const deploymentsResp = readJson(process.env.DEPLOYMENTS_JSON)
          const versionTags = process.env.VERSION_TAGS_JSON ? readJson(process.env.VERSION_TAGS_JSON) : {}

          let failed = false

          // Handled classes translate to a comparable "NAME type target" row.
          // Every other binding-shaped RawConfig key that is non-empty fails
          // the dry-run instead of being silently skipped, because a binding
          // this script cannot compare is a binding it cannot prove safe.
          // tail_consumers is compared under Settings, not here; `secrets` is
          // wrangler's local-dev-only value map and never ships a live binding.
          const UNHANDLED_BINDING_CLASSES = [
            'durable_objects', 'workflows', 'hyperdrive', 'dispatch_namespaces',
            'mtls_certificates', 'pipelines', 'ai_search_namespaces', 'ai_search',
            'images', 'media', 'stream', 'containers', 'cloudchamber',
            'worker_loaders', 'vpc_services', 'vpc_networks', 'unsafe_hello_world',
            'flagship', 'wasm_modules', 'text_blobs', 'data_blobs', 'site',
          ]
          const isNonEmptyBindingClass = (key, value) => {
            if (value == null) return false
            if (key === 'durable_objects') return Array.isArray(value.bindings) && value.bindings.length > 0
            if (Array.isArray(value)) return value.length > 0
            if (typeof value === 'object') return Object.keys(value).length > 0
            return Boolean(value)
          }
          const unhandled = UNHANDLED_BINDING_CLASSES.filter((key) => isNonEmptyBindingClass(key, built[key]))
          for (const key of unhandled) {
            console.log(`::error::unhandled binding class \`${key}\` — this dry-run cannot compare it against live; extend the diff before deploying`)
          }
          if (unhandled.length > 0) process.exit(1)

          const builtRows = new Set()
          const add = (n, t, x = '') => builtRows.add(`${n} ${t} ${x}`.trim())
          for (const [k, v] of Object.entries(built.vars ?? {})) add(k, typeof v === 'string' ? 'plain_text' : 'json', typeof v === 'string' ? v : JSON.stringify(v))
          for (const b of built.kv_namespaces ?? []) add(b.binding, 'kv_namespace', b.id)
          for (const b of built.d1_databases ?? []) add(b.binding, 'd1', b.database_id)
          for (const b of built.r2_buckets ?? []) add(b.binding, 'r2_bucket', b.bucket_name)
          for (const b of built.services ?? []) add(b.binding, 'service', b.service + (b.entrypoint ? '#' + b.entrypoint : ''))
          for (const b of built.queues?.producers ?? []) add(b.binding, 'queue', b.queue)
          for (const b of built.analytics_engine_datasets ?? []) add(b.binding, 'analytics_engine', b.dataset)
          for (const b of built.vectorize ?? []) add(b.binding, 'vectorize', b.index_name)
          for (const b of built.secrets_store_secrets ?? []) add(b.binding, 'secrets_store_secret', `${b.store_id}/${b.secret_name}`)
          for (const b of built.ratelimits ?? []) add(b.name, 'ratelimit', `${b.namespace_id}:${b.simple?.limit}/${b.simple?.period}`)
          for (const b of built.send_email ?? []) add(b.name, 'send_email')
          if (built.ai) add(built.ai.binding, 'ai')
          if (built.browser) add(built.browser.binding, 'browser')
          if (built.assets?.binding) add(built.assets.binding, 'assets')
          if (built.version_metadata) add(built.version_metadata.binding, 'version_metadata')

          const liveRows = new Set()
          let secretTextCount = 0
          for (const b of live.bindings ?? []) {
            const t = b.type
            if (t === 'secret_text') { secretTextCount += 1; continue }
            let x = ''
            if (t === 'plain_text') x = b.text
            else if (t === 'json') x = JSON.stringify(b.json)
            else if (t === 'kv_namespace') x = b.namespace_id
            else if (t === 'd1') x = b.id ?? b.database_id
            else if (t === 'r2_bucket') x = b.bucket_name
            else if (t === 'service') x = b.service + (b.entrypoint ? '#' + b.entrypoint : '')
            else if (t === 'queue') x = b.queue_name
            else if (t === 'analytics_engine') x = b.dataset
            else if (t === 'vectorize') x = b.index_name
            else if (t === 'secrets_store_secret') x = `${b.store_id}/${b.secret_name}`
            else if (t === 'ratelimit') x = `${b.namespace_id}:${b.simple?.limit}/${b.simple?.period}`
            liveRows.add(`${b.name} ${t} ${x}`.trim())
          }

          const onlyBuilt = [...builtRows].filter((r) => !liveRows.has(r)).sort()
          const onlyLive = [...liveRows].filter((r) => !builtRows.has(r)).sort()
          if (onlyBuilt.length > 0 || onlyLive.length > 0) failed = true
          if (builtRows.size === 0 || liveRows.size === 0) failed = true

          const sortedJson = (arr) => JSON.stringify([...(arr ?? [])].sort())
          const settingsRows = [
            ['compatibility date', built.compatibility_date ?? '', live.compatibility_date ?? ''],
            ['compatibility flags', sortedJson(built.compatibility_flags), sortedJson(live.compatibility_flags)],
            ['placement mode', built.placement?.mode ?? 'off', live.placement?.mode ?? 'off'],
            ['tail consumer services', sortedJson((built.tail_consumers ?? []).map((t) => t.service)), sortedJson((live.tail_consumers ?? []).map((t) => t.service))],
            ['observability enabled', String(built.observability?.enabled ?? false), String(live.observability?.enabled ?? false)],
            ['logs enabled', String(built.observability?.logs?.enabled ?? built.observability?.enabled ?? false), String(live.observability?.logs?.enabled ?? live.observability?.enabled ?? false)],
            ['crons', sortedJson(built.triggers?.crons), sortedJson((schedulesResp.result?.schedules ?? []).map((s) => s.cron))],
            ['workers_dev enabled', String(built.workers_dev ?? false), String(subdomainResp.result?.enabled ?? false)],
            ['previews enabled', String(built.preview_urls ?? built.workers_dev ?? false), String(subdomainResp.result?.previews_enabled ?? false)],
          ]
          for (const row of settingsRows) if (row[1] !== row[2]) failed = true

          const queueConsumers = (built.queues?.consumers ?? []).map((c) => c.queue)

          const deployments = [...(deploymentsResp.result?.deployments ?? [])].sort(
            (a, b) => new Date(b.created_on || 0).getTime() - new Date(a.created_on || 0).getTime(),
          )
          const activeDeployment = deployments[0]

          const lines = []
          lines.push('### Dry-run binding diff')
          lines.push('')
          lines.push(`built non-secret bindings: ${builtRows.size}; live bindings: ${(live.bindings ?? []).length} (${secretTextCount} secret_text kept across deploys, ${liveRows.size} other)`)
          lines.push(`only in built (${onlyBuilt.length}):`)
          for (const r of onlyBuilt) lines.push('  + ' + r)
          lines.push(`only in live (${onlyLive.length}):`)
          for (const r of onlyLive) lines.push('  - ' + r)
          lines.push('')
          lines.push('settings:')
          for (const [name, builtValue, liveValue] of settingsRows) {
            lines.push(`  ${name}: built=${builtValue} live=${liveValue} — ${builtValue === liveValue ? 'same' : 'DIFF'}`)
          }
          lines.push('')
          lines.push(`queue consumers (not compared): ${queueConsumers.length === 0 ? '(none)' : queueConsumers.join(', ')}`)
          lines.push('')
          if (activeDeployment) {
            lines.push(`active deployment ${activeDeployment.id} — rollback target:`)
            for (const v of activeDeployment.versions ?? []) {
              lines.push(`  version ${v.version_id} at ${v.percentage}% — tag ${versionTags[v.version_id] ?? 'unknown'}`)
            }
          } else {
            lines.push('active deployment: none found')
          }
          console.log(lines.join('\n'))

          if (builtRows.size === 0) console.log('::error::built binding count is 0 — a zero is unrun, never a pass')
          if (liveRows.size === 0) console.log('::error::live binding count is 0 — a zero is unrun, never a pass')

          process.exit(failed ? 1 : 0)
          BINDING_DIFF
