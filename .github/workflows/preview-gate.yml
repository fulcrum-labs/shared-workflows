name: Preview Gate (Reusable)

# Self-hosted replacement for the Workers Builds pr-check trigger: runs the
# repo's CI command on the self-hosted fleet, then uploads a per-PR preview
# VERSION of the Worker (`wrangler versions upload` — zero production traffic
# shift) and maintains one sticky PR comment carrying the preview URLs.
# Callers are generated by platform-foundations when a repo sets
# deployment.workers_builds.pr_builds: 'self-hosted'.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      check-command:
        type: string
        default: 'pnpm run ci:local'
        description: 'CI command to run before uploading the preview version.'
      artifact-build-command:
        type: string
        default: ''
        description: 'Production build command that replaces any CI-configured artifact before upload.'
      account-id:
        type: string
        required: true
        description: 'Cloudflare account ID owning the Worker.'
      wrangler-version:
        type: string
        default: '4.94.0'
        description: 'Wrangler version installed into RUNNER_TEMP for the upload.'
    secrets:
      CF_PREVIEW_API_TOKEN:
        required: true
        description: 'Cloudflare API token with Workers Scripts: Edit on the target account. Uploads versions only; cannot shift production traffic.'

permissions:
  contents: read

concurrency:
  group: preview-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = "10.28.0"
          package_json = Path("package.json")
          if package_json.exists():
            data = json.loads(package_json.read_text())
            package_manager = data.get("packageManager")
            if isinstance(package_manager, str) and package_manager.startswith("pnpm@"):
              version = package_manager.split("@", 1)[1]
            else:
              volta = data.get("volta")
              if isinstance(volta, dict):
                volta_pnpm = volta.get("pnpm")
                if isinstance(volta_pnpm, str) and volta_pnpm:
                  version = volta_pnpm

          print(f"version={version}")
          PY

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Guard pnpm runner isolation
        run: |
          case "${PNPM_HOME:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::PNPM_HOME must be under RUNNER_TEMP on self-hosted runners; got '${PNPM_HOME:-<unset>}'"
              exit 1
              ;;
          esac

          if [ -e "$HOME/setup-pnpm" ]; then
            echo "::warning::Removing stale home-level pnpm setup from prior self-hosted jobs"
            rm -rf "$HOME/setup-pnpm"
          fi

          echo "NPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run CI command
        run: ${{ inputs.check-command }}

      - name: Install wrangler
        run: |
          WRANGLER_DIR="$RUNNER_TEMP/wrangler-install"
          mkdir -p "$WRANGLER_DIR"
          npm install --prefix "$WRANGLER_DIR" --no-audit --no-fund wrangler@${{ inputs.wrangler-version }}
          WRANGLER_BIN="$WRANGLER_DIR/node_modules/.bin/wrangler"
          "$WRANGLER_BIN" --version
          echo "WRANGLER_BIN=$WRANGLER_BIN" >> "$GITHUB_ENV"

      # Astro's Cloudflare adapter writes a redirected deploy config into the
      # build output. A CI build can intentionally omit production bindings,
      # so replace that artifact before Wrangler discovers and uploads it.
      - name: Build production preview artifact
        if: inputs.artifact-build-command != ''
        env:
          # AUTHENTICATED, for the same reason deploy-gate's production build is
          # (shared-workflows#32). This step exists precisely because a CI build
          # omits production bindings — but rebuilding it tokenlessly reproduces
          # the defect it is meant to repair: site configs branch on
          # `CI && !CLOUDFLARE_API_TOKEN` and fall back to a local TEST stub for
          # `cloudflare:workers`, whose `env` proxies an empty object. The
          # uploaded preview then resolves no bindings at all, so reviewers see
          # article routes 500 and listing pages render empty — a preview that
          # cannot show the change under review. Same token the upload step uses.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        run: ${{ inputs.artifact-build-command }}

      # Same invariant deploy-gate enforces: a test-only module in the artifact
      # means the build took a tokenless path, and uploading it would publish a
      # Worker with no bindings. Fail loudly instead.
      - name: Assert no test-only modules in the preview artifact
        if: inputs.artifact-build-command != ''
        run: |
          set -euo pipefail
          if [ ! -d dist/server ]; then
            echo "No dist/server directory; skipping test-module assertion."
            exit 0
          fi
          if grep -rlF 'src/lib/testing/' dist/server > /tmp/preview-test-module-hits.txt 2>/dev/null; then
            echo "::error::Test-only modules were bundled into the preview artifact:"
            cat /tmp/preview-test-module-hits.txt
            echo "The build took a tokenless/test code path. Do NOT upload this artifact."
            exit 1
          fi
          echo "OK: dist/server references no src/lib/testing/ module."

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          "$WRANGLER_BIN" versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "${HEAD_SHA:0:12}" \
            --message "commit=${HEAD_SHA} pr=${PR_NUMBER} preview" \
            2>&1 | tee "$RUNNER_TEMP/preview-upload.log"

          # `|| true`: the default shell runs with -e, so a no-match grep would
          # kill the step at this assignment and skip the diagnostic below.
          urls=$(grep -Eo 'https://[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.workers\.dev[^ ]*' "$RUNNER_TEMP/preview-upload.log" | sort -u || true)
          if [ -z "$urls" ]; then
            # Private Workers (workers_dev/preview_urls disabled — e.g. finance apps) never emit a
            # preview URL. The upload itself succeeded and IS the build gate; do not fail the PR —
            # warn loudly and let the sticky comment say there is no URL to open.
            echo "::warning::wrangler versions upload succeeded but produced no preview URL (preview_urls/workers_dev disabled for this Worker). The uploaded version is the build gate; nothing to open."
          fi
          {
            echo "urls<<URLS_EOF"
            echo "$urls"
            echo "URLS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            if [ -n "$urls" ]; then
              echo "### Preview uploaded"
              echo ""
              echo "$urls" | sed 's/^/- /'
            else
              echo "### Preview version uploaded — no preview URL (preview_urls disabled)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URLS: ${{ steps.upload.outputs.urls }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- self-hosted-preview -->'
            const urls = process.env.PREVIEW_URLS.trim().split('\n').filter(Boolean)
            const alias = urls.find(u => u.startsWith(`https://pr-${context.issue.number}-`))
            const lines = urls.length === 0 ? [
              marker,
              '### Preview',
              '',
              `Commit \`${process.env.HEAD_SHA.slice(0, 12)}\`: version uploaded — no preview URL (preview_urls is disabled for this Worker).`,
              '',
              '_Uploaded as a Worker version — production traffic is untouched._',
            ] : [
              marker,
              '### Preview',
              '',
              ...(alias ? [`**Branch preview (stable for this PR):** ${alias}`, ''] : []),
              `Commit \`${process.env.HEAD_SHA.slice(0, 12)}\`:`,
              ...urls.filter(u => u !== alias).map(u => `- ${u}`),
              '',
              '_Uploaded as a Worker version — production traffic is untouched._',
            ]
            const body = lines.join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(c => c.body && c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
