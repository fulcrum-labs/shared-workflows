name: Preview Gate (Reusable)

# Self-hosted replacement for the Workers Builds pr-check trigger: runs the
# repo's CI command on the self-hosted fleet, then uploads a per-PR preview
# VERSION of the Worker (`wrangler versions upload` — zero production traffic
# shift) and maintains one sticky PR comment carrying the preview URLs.
# Callers are generated by platform-foundations when a repo sets
# deployment.workers_builds.pr_builds: 'self-hosted'.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      check-command:
        type: string
        default: 'pnpm run ci:local'
        description: 'CI command to run before uploading the preview version.'
      account-id:
        type: string
        required: true
        description: 'Cloudflare account ID owning the Worker.'
      wrangler-version:
        type: string
        default: '4.94.0'
        description: 'Wrangler version installed into RUNNER_TEMP for the upload.'
    secrets:
      CF_PREVIEW_API_TOKEN:
        required: true
        description: 'Cloudflare API token with Workers Scripts: Edit on the target account. Uploads versions only; cannot shift production traffic.'

permissions:
  contents: read

concurrency:
  group: preview-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve pnpm version
        id: pnpm-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          version = "10.28.0"
          package_json = Path("package.json")
          if package_json.exists():
            data = json.loads(package_json.read_text())
            package_manager = data.get("packageManager")
            if isinstance(package_manager, str) and package_manager.startswith("pnpm@"):
              version = package_manager.split("@", 1)[1]
            else:
              volta = data.get("volta")
              if isinstance(volta, dict):
                volta_pnpm = volta.get("pnpm")
                if isinstance(volta_pnpm, str) and volta_pnpm:
                  version = volta_pnpm

          print(f"version={version}")
          PY

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Guard pnpm runner isolation
        run: |
          case "${PNPM_HOME:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::PNPM_HOME must be under RUNNER_TEMP on self-hosted runners; got '${PNPM_HOME:-<unset>}'"
              exit 1
              ;;
          esac

          if [ -e "$HOME/setup-pnpm" ]; then
            echo "::warning::Removing stale home-level pnpm setup from prior self-hosted jobs"
            rm -rf "$HOME/setup-pnpm"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run CI command
        run: ${{ inputs.check-command }}

      - name: Install wrangler
        run: |
          WRANGLER_DIR="$RUNNER_TEMP/wrangler-install"
          mkdir -p "$WRANGLER_DIR"
          npm install --prefix "$WRANGLER_DIR" --no-audit --no-fund wrangler@${{ inputs.wrangler-version }}
          WRANGLER_BIN="$WRANGLER_DIR/node_modules/.bin/wrangler"
          "$WRANGLER_BIN" --version
          echo "WRANGLER_BIN=$WRANGLER_BIN" >> "$GITHUB_ENV"

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          "$WRANGLER_BIN" versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "${HEAD_SHA:0:12}" \
            --message "commit=${HEAD_SHA} pr=${PR_NUMBER} preview" \
            2>&1 | tee "$RUNNER_TEMP/preview-upload.log"

          urls=$(grep -Eo 'https://[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.workers\.dev[^ ]*' "$RUNNER_TEMP/preview-upload.log" | sort -u)
          if [ -z "$urls" ]; then
            echo "::error::wrangler versions upload produced no preview URL — is preview_urls enabled in wrangler.toml?"
            exit 1
          fi
          {
            echo "urls<<URLS_EOF"
            echo "$urls"
            echo "URLS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Preview uploaded"
            echo ""
            echo "$urls" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URLS: ${{ steps.upload.outputs.urls }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- self-hosted-preview -->'
            const urls = process.env.PREVIEW_URLS.trim().split('\n').filter(Boolean)
            const alias = urls.find(u => u.startsWith(`https://pr-${context.issue.number}-`))
            const lines = [
              marker,
              '### Preview',
              '',
              ...(alias ? [`**Branch preview (stable for this PR):** ${alias}`, ''] : []),
              `Commit \`${process.env.HEAD_SHA.slice(0, 12)}\`:`,
              ...urls.filter(u => u !== alias).map(u => `- ${u}`),
              '',
              '_Uploaded as a Worker version — production traffic is untouched._',
            ]
            const body = lines.join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(c => c.body && c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
