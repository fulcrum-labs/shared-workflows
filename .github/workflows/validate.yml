name: Validate shared workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    # SECURITY: this repo is PUBLIC. pull_request jobs must never target the
    # self-hosted fleet — a fork PR executes arbitrary code on the runner host.
    # Hosted-only is asserted by test-self-hosted-runners.mjs.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Reusable CI gate contract
        run: node --test .github/scripts/test-ci-gate.mjs .github/scripts/test-self-hosted-runners.mjs
