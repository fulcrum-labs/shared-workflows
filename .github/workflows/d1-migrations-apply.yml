# Reusable workflow: apply unapplied D1 migrations on push to main.
#
# Consumer wrapper shape (one-liner per repo):
#
#   # .github/workflows/d1-migrations.yml in the consumer repo
#   name: D1 migrations apply
#   on:
#     push: { branches: [main] }
#     workflow_dispatch: {}
#   permissions: { contents: read }
#   jobs:
#     apply:
#       uses: fulcrum-labs/shared-workflows/.github/workflows/d1-migrations-apply.yml@main
#       with:
#         database-name: <your-d1-name>
#         account-id: <your-cloudflare-account-id>
#       secrets:
#         CF_API_TOKEN: ${{ secrets.CF_FULCRUM_TOKEN }}
#
# Why this exists: 2026-05-25 incident — PR #376 on fronts merged a
# migration adding `subscriptions.is_current` plus code that queried it.
# Cloudflare Builds deployed the code but the migration was never run;
# the site 5xx'd for ~14 minutes. CF Builds only runs `wrangler deploy`
# — it does NOT apply migrations. This workflow closes that gap.
# KB: fronts-d1-migration-and-monitoring-gap-2026-05-25.
#
# `dry-run: true` lists what apply-missing would do (repo migrations not yet
# in d1_migrations) and exits without applying anything or writing to the
# ledger. Added for a staging catch-up dispatch previewing before commit;
# default false leaves every existing caller applying exactly as before.

name: D1 migrations apply (reusable)

on:
  workflow_call:
    inputs:
      database-name:
        type: string
        required: true
        description: "Cloudflare D1 database name (matches `database_name` in wrangler.toml)."
      account-id:
        type: string
        required: true
        description: "Cloudflare account ID owning the D1 database."
      migrations-dir:
        type: string
        default: "migrations"
        description: "Directory containing the *.sql migration files. Defaults to migrations/."
      wrangler-version:
        type: string
        default: "4.94.0"
        description: "Wrangler version to install via npm install -g."
      shared-workflows-ref:
        type: string
        default: "main"
        description: "Git ref of fulcrum-labs/shared-workflows to check out alongside the consumer repo (for the apply-d1-migrations.mjs script)."
      dry-run:
        type: boolean
        default: false
        description: "List pending migrations and exit without applying anything or writing to d1_migrations. Default false keeps every existing caller applying exactly as before this input existed."
      database-id:
        type: string
        default: ""
        description: "Cloudflare D1 database uuid. When set, verified (via the account's D1 list endpoint, read-only) against what database-name actually resolves to, before any D1 interaction and regardless of dry-run -- refuses on a mismatch. Name alone is otherwise the only selector against the same account and token as prod, so a staging config carrying prod's uuid would otherwise silently write prod. Optional and unverified when empty, keeping every existing caller unchanged."
      reset-and-replay:
        type: boolean
        default: false
        description: "M2-19 R17: drop every object in the target D1 (including d1_migrations itself), then apply every migration file from scratch against the now-empty ledger. Irreversible. Refuses unless database-name ends in -staging, differs from prod-database-name, database-id is set and verified, and confirm exactly equals database-name. Default false keeps every existing caller unaffected -- this workflow exposes it, but only the platform-foundations staging wrapper should ever set it true."
      confirm:
        type: string
        default: ""
        description: "Required, and checked, only when reset-and-replay is true: must exactly equal database-name. Typed confirmation that the dispatcher named the right target before anything is dropped."
      prod-database-name:
        type: string
        default: ""
        description: "Required, and checked, only when reset-and-replay is true: this workflow refuses to reset a database-name equal to this value, and refuses outright if reset-and-replay is set but this is empty (an unprovable target != prod)."
      replay-manifest-path:
        type: string
        default: ""
        description: "M2-19 R17: only valid alongside reset-and-replay -- refuses otherwise. Repo-relative path to a checked-in JSON file ({entries:[{path,apply,supersededBy?}]}) that replaces the default 'read migrations-dir alphabetically' behaviour with this exact, explicit, ordered list of {path,apply} entries -- each path resolved relative to the checkout root, so it can span more than one directory (e.g. a consumer's own migrations plus a dependency's own migrations_dir -- this workflow never runs a package install, so a dependency's files are ledger-only (apply:false) unless actually present in the checkout). apply:false records a d1_migrations ledger row (by the path's basename) without executing the file's SQL, for a migration whose schema effect is already covered by an earlier apply:true entry under a different name (one entry may cover many superseded names, e.g. M2-19 R17(B): 116 names covered by one committed baseline); an apply:false entry's path is exempt from the existence/symlink checks apply:true requires (it is never read), but not from the .sql-suffix, containment, or uniqueness checks every entry gets regardless. supersededBy must be that earlier entry's exact path string, byte for byte, not just its basename. Default empty keeps every existing caller reading migrations-dir alphabetically, exactly as before this input existed."
    secrets:
      CF_API_TOKEN:
        required: true
        description: "Cloudflare API token with `Workers Scripts:Edit` + `D1:Edit` on the target account."

permissions:
  contents: read

concurrency:
  # Keyed on the DATABASE, not the ref: a staging catch-up dispatch and a
  # prod push-apply are different refs but can hit the SAME database when a
  # caller's database-name input is misconfigured, and even when they don't,
  # keying on ref meant a staging dispatch (a different ref) could CANCEL a
  # pending prod push-apply in the same repo (one pending run per group;
  # cancel-in-progress stays false, so a same-database queue still waits
  # rather than clobbers). account-id included too: a database-name string
  # is only unique within one Cloudflare account, so two different accounts
  # (this workflow is shared across every Fulcrum repo) with a same-named
  # database would otherwise share one group despite being unrelated.
  group: d1-migrations-${{ github.repository }}-${{ inputs.account-id }}-${{ inputs.database-name }}
  cancel-in-progress: false

jobs:
  apply:
    # break-glass: swap runs-on back to ubuntu-24.04 if self-hosted fleet unavailable
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      D1_DATABASE_NAME: ${{ inputs.database-name }}
      D1_MIGRATIONS_DIR: ${{ inputs.migrations-dir }}
      D1_MIGRATIONS_DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
      # Fixes #58: this was never wired, so verifyDatabaseId() and the
      # generated-config pin (apply-d1-migrations.mjs) always no-op'd on an
      # empty DATABASE_ID regardless of what a caller passed as database-id
      # -- #58's entire server-side verification has been dead code since it
      # merged. Every existing caller that never sets database-id is
      # unaffected (still empty, still skipped). (fulcrum-labs/shared-workflows#61)
      D1_DATABASE_ID: ${{ inputs.database-id }}
      D1_MIGRATIONS_RESET_AND_REPLAY: ${{ inputs.reset-and-replay && '1' || '' }}
      D1_MIGRATIONS_CONFIRM: ${{ inputs.confirm }}
      D1_MIGRATIONS_PROD_DATABASE_NAME: ${{ inputs.prod-database-name }}
      D1_MIGRATIONS_REPLAY_MANIFEST_PATH: ${{ inputs.replay-manifest-path }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v5

      - name: Checkout shared-workflows for helper script
        uses: actions/checkout@v5
        with:
          repository: fulcrum-labs/shared-workflows
          ref: ${{ inputs.shared-workflows-ref }}
          path: .shared-workflows

      # Self-hosted runners cannot install globally at all: node lives in a
      # root-owned /opt/nodejs prefix, so `npm install -g` EACCESes (and the
      # global bin dir is not on PATH anyway — issue #21: fronts migrations
      # silently never applied). Install into the runner's writable temp dir,
      # smoke the binary so a broken install fails THIS step loudly, and hand
      # the absolute path to the apply script via WRANGLER_BIN.
      - name: Install wrangler
        run: |
          WRANGLER_DIR="$RUNNER_TEMP/wrangler-install"
          mkdir -p "$WRANGLER_DIR"
          npm install --prefix "$WRANGLER_DIR" --no-audit --no-fund wrangler@${{ inputs.wrangler-version }}
          WRANGLER_BIN="$WRANGLER_DIR/node_modules/.bin/wrangler"
          "$WRANGLER_BIN" --version
          echo "WRANGLER_BIN=$WRANGLER_BIN" >> "$GITHUB_ENV"

      - name: Apply pending migrations
        run: node .shared-workflows/.github/scripts/apply-d1-migrations.mjs
